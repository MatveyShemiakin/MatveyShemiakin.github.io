<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Unified header contrast audit</title></head>
<body data-audit-status="running">
<pre id="report">Running…</pre>
<iframe id="page" hidden></iframe>
<script>
(async()=>{
  const report=document.getElementById('report');
  const frame=document.getElementById('page');
  const pages=['/','/en/','/patients/','/en/patients/','/patients/cataract/','/en/patients/cataract/','/for-doctors/','/en/for-doctors/','/for-doctors/bacterial-keratitis/','/en/for-doctors/bacterial-keratitis/','/for-doctors/events/','/en/for-doctors/events/','/collaboration/','/en/collaboration/'];
  const failures=[];
  let checked=0;
  const parseColor=value=>{const m=String(value||'').match(/rgba?\(([^)]+)\)/i);if(!m)return null;const p=m[1].split(/[ ,/]+/).filter(Boolean).map(Number);return{r:p[0],g:p[1],b:p[2],a:Number.isFinite(p[3])?p[3]:1}};
  const mix=(fg,bg)=>({r:fg.r*fg.a+bg.r*(1-fg.a),g:fg.g*fg.a+bg.g*(1-fg.a),b:fg.b*fg.a+bg.b*(1-fg.a),a:1});
  const lum=({r,g,b})=>{const f=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)};
  const ratio=(a,b)=>{const A=lum(a),B=lum(b);return(Math.max(A,B)+.05)/(Math.min(A,B)+.05)};
  const directText=el=>Array.from(el.childNodes).some(n=>n.nodeType===3&&n.textContent.trim());
  const label=el=>`${el.tagName.toLowerCase()}${el.id?'#'+el.id:''}${el.classList.length?'.'+Array.from(el.classList).slice(0,3).join('.'):''} :: ${(el.innerText||el.textContent||'').trim().replace(/\s+/g,' ').slice(0,90)}`;
  const effectiveBg=(el,win)=>{const header=el.closest('.unified-site-header');let node=el;while(node&&node.nodeType===1){const s=win.getComputedStyle(node);const c=parseColor(s.backgroundColor);if(c&&c.a>.96)return{color:c};if(node===header)return{color:{r:4,g:18,b:37,a:1}};node=node.parentElement}return{color:{r:4,g:18,b:37,a:1}}};
  const shouldSkip=(el,s)=>{if(['SCRIPT','STYLE','SVG','PATH','IMG'].includes(el.tagName))return true;if(el.closest('[aria-hidden="true"]'))return true;if(s.display==='none'||s.visibility==='hidden'||Number(s.opacity)===0)return true;const r=el.getBoundingClientRect();if(r.width<2||r.height<2)return true;return!directText(el)};
  const load=(url,theme)=>new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;setTimeout(resolve,140)};localStorage.setItem('site_theme_v1',theme);frame.onload=finish;frame.src=url+(url.includes('?')?'&':'?')+'header-contrast='+theme+'-'+Date.now();setTimeout(finish,2200)});
  for(const theme of ['light','dark'])for(const url of pages){
    await load(url,theme);
    const doc=frame.contentDocument,win=frame.contentWindow;
    if(!doc||!win){failures.push({url,theme,reason:'no document'});continue}
    const header=doc.querySelector('.unified-site-header[data-unified-site-header="true"]');
    if(!header){failures.push({url,theme,reason:'unified header missing'});continue}
    if(doc.documentElement.dataset.siteTheme!==theme){failures.push({url,theme,reason:`theme state is ${doc.documentElement.dataset.siteTheme||'missing'}`});continue}
    for(const el of header.querySelectorAll('*')){
      const s=win.getComputedStyle(el);if(shouldSkip(el,s))continue;
      const bg=effectiveBg(el,win);let fg=parseColor(s.color);if(!fg)continue;if(fg.a<1)fg=mix(fg,bg.color);
      const cr=ratio(fg,bg.color),size=parseFloat(s.fontSize)||16,weight=parseInt(s.fontWeight,10)||400,min=(size>=24||(size>=18.66&&weight>=700))?3:4.5;checked++;
      if(cr+.01<min)failures.push({url,theme,ratio:cr.toFixed(2),min,label:label(el),color:s.color});
    }
  }
  const unique=[];const seen=new Set();for(const f of failures){const k=JSON.stringify(f);if(!seen.has(k)){seen.add(k);unique.push(f)}}
  report.textContent=JSON.stringify({pages:pages.length,themeRenders:pages.length*2,checked,failures:unique.length,items:unique},null,2);
  document.body.dataset.auditStatus=unique.length?'fail':'pass';document.body.dataset.auditFailures=String(unique.length);
})();
</script>
</body></html>
