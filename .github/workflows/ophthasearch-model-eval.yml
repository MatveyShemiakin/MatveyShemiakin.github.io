name: OphthaSearch model comparison
on:
  push:
    branches: ['eval/ophthasearch-models-20260912']
    paths: ['scripts/ophthasearch-eval/**', '.github/workflows/ophthasearch-model-eval.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ophthasearch-model-comparison
  cancel-in-progress: false
jobs:
  compare:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify budget and regressions without AI
        run: node --test tests/ophthasearch*.test.mjs
      - name: Run at most nine comparisons using existing Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ophthasearch-eval/runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ophthasearch-model-comparison
          path: eval-results/
          retention-days: 30
