name: Install global language switch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-global-language-switch.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared language switch assets to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_tag = '<link rel="stylesheet" href="/site-language-switch.css?v=20260729-2">'
          js_tag = '<script defer src="/site-language-switch.js?v=20260729-2"></script>'
          changed = []

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = re.sub(
                  r'\s*<link\b[^>]*href=["\']/site-language-switch\.css(?:\?[^"\']*)?["\'][^>]*>',
                  '', text, flags=re.I
              )
              updated = re.sub(
                  r'\s*<script\b[^>]*src=["\']/site-language-switch\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>',
                  '', updated, flags=re.I
              )

              if re.search(r'</head\s*>', updated, flags=re.I):
                  updated = re.sub(r'</head\s*>', css_tag + '</head>', updated, count=1, flags=re.I)
              else:
                  continue

              if re.search(r'</body\s*>', updated, flags=re.I):
                  updated = re.sub(r'</body\s*>', js_tag + '</body>', updated, count=1, flags=re.I)
              else:
                  continue

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          for item in changed:
              print(item)
          PY
      - name: Commit all updated pages
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Обновить единый переключатель языка на всех страницах [skip ci]'
          git push
