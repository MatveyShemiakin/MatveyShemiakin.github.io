name: Implement site breadcrumbs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-site-breadcrumbs.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate breadcrumbs
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply-breadcrumbs.py
          python3 /tmp/apply-breadcrumbs.py
          node --check legal.js
          node --check doctors-legal.js
          node tests/site-breadcrumbs.test.mjs
          git diff --check
      - name: Commit and publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/implement-site-breadcrumbs.yml
          git add -A
          git diff --cached --check
          git commit -m 'Add consistent breadcrumbs across content pages'
          git push origin main
