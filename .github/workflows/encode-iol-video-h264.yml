name: encode-iol-video-h264

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/encode-iol-video-h264.yml'
      - 'for-doctors/iol-dislocation/assets/pupillary-capture.mp4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Encode browser-compatible H.264
        run: |
          set -euo pipefail
          SRC='for-doctors/iol-dislocation/assets/pupillary-capture.mp4'
          OUT='for-doctors/iol-dislocation/assets/pupillary-capture-h264.mp4'
          test -s "$SRC"
          ffmpeg -y -i "$SRC" -an -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart "$OUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height -of default=noprint_wrappers=1 "$OUT"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")" = 'h264'
          test -s "$OUT"

      - name: Commit encoded video
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add for-doctors/iol-dislocation/assets/pupillary-capture-h264.mp4
          if git diff --cached --quiet; then
            echo 'H.264 video already current'
            exit 0
          fi
          git commit -m 'media: add browser-compatible H264 IOL video'
          git push
