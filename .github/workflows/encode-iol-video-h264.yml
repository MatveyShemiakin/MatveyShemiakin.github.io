name: encode-iol-video-h264

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/encode-iol-video-h264.yml'
      - 'for-doctors/iol-dislocation/assets/pupillary-capture.mp4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Encode browser-compatible H.264
        run: |
          set -euo pipefail
          SRC='for-doctors/iol-dislocation/assets/pupillary-capture.mp4'
          OUT='for-doctors/iol-dislocation/assets/pupillary-capture-h264.mp4'
          test -s "$SRC"
          ffmpeg -y -i "$SRC" -an -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart "$OUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height -of default=noprint_wrappers=1 "$OUT"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")" = 'h264'
          test -s "$OUT"

      - name: Bust IOL asset cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('for-doctors/iol-dislocation/index.html')
          s = p.read_text()
          s = s.replace('page.css?v=20260825-3', 'page.css?v=20260826-3')
          s = s.replace('media.css?v=20260826-1', 'media.css?v=20260826-3')
          s = s.replace('script.js?v=20260826-1', 'script.js?v=20260826-3')
          p.write_text(s)
          PY

      - name: Commit encoded video and cache versions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add for-doctors/iol-dislocation/assets/pupillary-capture-h264.mp4 for-doctors/iol-dislocation/index.html
          if git diff --cached --quiet; then
            echo 'H.264 video and cache versions already current'
            exit 0
          fi
          git commit -m 'media: publish browser-compatible H264 IOL video'
          git pull --rebase origin main
          git push origin main
