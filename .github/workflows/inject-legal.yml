name: Inject legal, analytics and professional modules

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'analytics.js'
      - 'legal.js'
      - 'legal.css'
      - 'doctors-legal.js'
      - 'doctors-legal.css'
      - 'privacy.html'
      - 'en/privacy.html'
      - 'for-doctors/professional-use.html'
      - 'en/for-doctors/professional-use.html'
      - 'for-doctors/updates.json'
      - 'for-doctors/updates-manifest.json'
      - 'for-doctors/professional-meta.json'
      - 'for-doctors/doctors-updates.js'
      - 'for-doctors/doctors-updates.css'
      - 'for-doctors/doctor-retention.js'
      - 'for-doctors/doctor-retention.css'
      - 'patients/updates.json'
      - 'patients/patients-updates.js'
      - 'patients/patients-updates.css'
      - 'patients/consultation-cta.css'
      - 'site-mega-nav.js'
      - 'site-mega-nav.css'
      - 'scripts/generate_doctors_updates.py'
      - 'scripts/inject_doctors_updates.py'
      - 'scripts/inject_doctor_retention.py'
      - 'scripts/inject_legal.py'
      - 'scripts/inject_content_analytics.py'
      - 'scripts/inject_patient_updates.py'
      - 'scripts/inject_patient_consultation_cta.py'
      - 'scripts/inject_site_mega_nav.py'
      - 'tests/test_generate_doctors_updates.py'
      - 'tests/test_doctors_updates_inject.py'
      - 'tests/doctors-updates.test.mjs'
      - 'tests/test_doctor_retention_inject.py'
      - 'tests/doctor-retention.test.mjs'
      - 'tests/test_professional_updates_page.py'
      - 'tests/test_content_analytics.py'
      - 'tests/test_analytics_events.mjs'
      - 'tests/patient-updates.test.mjs'
      - 'tests/test_patient_updates_inject.py'
      - 'tests/test_patient_consultation_cta.py'
      - 'tests/test_site_mega_nav.py'
      - 'tests/site-mega-nav.test.mjs'
      - '.github/workflows/inject-legal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate_doctors_updates.py
      - run: python scripts/inject_doctors_updates.py
      - run: python scripts/inject_doctor_retention.py
      - run: python scripts/inject_legal.py
      - run: python scripts/inject_content_analytics.py
      - run: python scripts/inject_patient_updates.py
      - run: python scripts/inject_patient_consultation_cta.py
      - run: python scripts/inject_site_mega_nav.py
      - run: python -m unittest tests/test_generate_doctors_updates.py
      - run: python -m unittest tests/test_doctors_updates_inject.py
      - run: python -m unittest tests/test_doctor_retention_inject.py
      - run: python -m unittest tests/test_professional_updates_page.py
      - run: python -m unittest tests/test_content_analytics.py
      - run: python -m unittest tests/test_patient_updates_inject.py
      - run: python -m unittest tests/test_patient_consultation_cta.py
      - run: python -m unittest tests/test_site_mega_nav.py
      - run: node --check analytics.js
      - run: node tests/test_analytics_events.mjs
      - run: node --check for-doctors/doctors-updates.js
      - run: node --test tests/doctors-updates.test.mjs
      - run: node --check for-doctors/doctor-retention.js
      - run: node --test tests/doctor-retention.test.mjs
      - run: node --check patients/patients-updates.js
      - run: node --test tests/patient-updates.test.mjs
      - run: node --check site-mega-nav.js
      - run: node tests/site-mega-nav.test.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' sitemap.xml for-doctors/updates.json for-doctors/updates-manifest.json || true
          git commit -m "Inject site modules and clinician retention"
          git push

  deploy_contact_worker:
    needs: inject
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTACT_RECIPIENT: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CONTACT_RECIPIENT"
      - name: Deploy contact Worker
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/contact-worker
          secrets: |
            CONTACT_RECIPIENT
      - name: Verify Worker route
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          code="$(curl --silent --show-error --output /tmp/contact-worker-response --write-out '%{http_code}' --request OPTIONS https://matveyshemyakin.ru/api/contact)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/contact-worker-response || true
          test "$code" = "204"
      - name: Record deployment status
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_STDERR: ${{ steps.deploy.outputs.command-stderr }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ROUTE_CODE: ${{ steps.verify.outputs.code }}
        run: |
          status="failed"
          reason="cloudflare_deploy"
          route_code="${ROUTE_CODE:-0}"
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ] && [ "$route_code" = "204" ]; then
            status="deployed"
            reason="ok"
          elif [ "$DEPLOY_OUTCOME" = "success" ]; then
            reason="route_verification"
          else
            err="$(printf '%s' "$DEPLOY_STDERR" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$err" | grep -qE 'email|send_email'; then
              reason="email_service_or_binding"
            elif printf '%s' "$err" | grep -qE 'unauthor|authenticat|permission|10000|10001'; then
              reason="cloudflare_auth_or_permissions"
            elif printf '%s' "$err" | grep -qE 'route|zone'; then
              reason="route_or_zone"
            fi
          fi
          mkdir -p .deployment
          printf '{\n  "service": "contact-worker",\n  "status": "%s",\n  "reason": "%s",\n  "route_check": %s,\n  "source_sha": "%s",\n  "checked_at_utc": "%s"\n}\n' "$status" "$reason" "$route_code" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deployment/contact-worker.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/contact-worker.json
          if ! git diff --cached --quiet; then
            git commit -m "Record contact Worker deployment status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require successful deployment
        if: always()
        run: grep -q '"status": "deployed"' .deployment/contact-worker.json
