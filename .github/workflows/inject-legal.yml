# Shared site-module injection is idempotent; this commit triggers the unified-header rollout.
name: Inject legal, analytics and professional modules

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'analytics.js'
      - 'legal.js'
      - 'legal.css'
      - 'doctors-legal.js'
      - 'doctors-legal.css'
      - 'privacy.html'
      - 'en/privacy.html'
      - 'for-doctors/professional-use.html'
      - 'en/for-doctors/professional-use.html'
      - 'for-doctors/updates.json'
      - 'for-doctors/updates-manifest.json'
      - 'for-doctors/professional-meta.json'
      - 'for-doctors/doctors-updates.js'
      - 'for-doctors/doctors-updates.css'
      - 'for-doctors/doctor-retention.js'
      - 'for-doctors/doctor-retention.css'
      - 'patients/updates.json'
      - 'patients/patients-updates.js'
      - 'patients/patients-updates.css'
      - 'patients/consultation-cta.css'
      - 'site-header-unified.js'
      - 'site-header-unified.css'
      - 'site-mega-nav.js'
      - 'site-mega-nav.css'
      - 'scripts/generate_doctors_updates.py'
      - 'scripts/inject_doctors_updates.py'
      - 'scripts/inject_doctor_retention.py'
      - 'scripts/inject_legal.py'
      - 'scripts/inject_content_analytics.py'
      - 'scripts/inject_patient_updates.py'
      - 'scripts/inject_patient_consultation_cta.py'
      - 'scripts/inject_unified_header.py'
      - 'scripts/inject_site_mega_nav.py'
      - 'tests/test_generate_doctors_updates.py'
      - 'tests/test_doctors_updates_inject.py'
      - 'tests/doctors-updates.test.mjs'
      - 'tests/test_doctor_retention_inject.py'
      - 'tests/doctor-retention.test.mjs'
      - 'tests/test_professional_updates_page.py'
      - 'tests/test_content_analytics.py'
      - 'tests/test_analytics_events.mjs'
      - 'tests/patient-updates.test.mjs'
      - 'tests/test_patient_updates_inject.py'
      - 'tests/test_patient_consultation_cta.py'
      - 'tests/test_unified_header_inject.py'
      - 'tests/test_unified_header_coverage.py'
      - 'tests/site-header-unified.test.mjs'
      - 'tests/test_site_mega_nav.py'
      - 'tests/site-mega-nav.test.mjs'
      - '.github/workflows/inject-legal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate_doctors_updates.py
      - run: python scripts/inject_doctors_updates.py
      - run: python scripts/inject_doctor_retention.py
      - run: python scripts/inject_legal.py
      - run: python scripts/inject_content_analytics.py
      - run: python scripts/inject_patient_updates.py
      - run: python scripts/inject_patient_consultation_cta.py
      - run: python scripts/inject_unified_header.py
      - run: python scripts/inject_site_mega_nav.py
      - run: python -m unittest tests/test_generate_doctors_updates.py
      - run: python -m unittest tests/test_doctors_updates_inject.py
      - run: python -m unittest tests/test_doctor_retention_inject.py
      - run: python -m unittest tests/test_professional_updates_page.py
      - run: python -m unittest tests/test_content_analytics.py
      - run: python -m unittest tests/test_patient_updates_inject.py
      - run: python -m unittest tests/test_patient_consultation_cta.py
      - run: python -m unittest tests/test_unified_header_inject.py
      - run: python -m unittest tests/test_unified_header_coverage.py
      - run: python -m unittest tests/test_site_mega_nav.py
      - run: node --check analytics.js
      - run: node tests/test_analytics_events.mjs
      - run: node --check for-doctors/doctors-updates.js
      - run: node --test tests/doctors-updates.test.mjs
      - run: node --check for-doctors/doctor-retention.js
      - run: node --test tests/doctor-retention.test.mjs
      - run: node --check patients/patients-updates.js
      - run: node --test tests/patient-updates.test.mjs
      - run: node --check site-header-unified.js
      - run: node --test tests/site-header-unified.test.mjs
      - run: node --check site-mega-nav.js
      - run: node tests/site-mega-nav.test.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' sitemap.xml for-doctors/updates.json for-doctors/updates-manifest.json || true
          git commit -m "Inject site modules and unified header"
          git push
