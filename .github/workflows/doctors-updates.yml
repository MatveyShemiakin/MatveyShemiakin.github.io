name: Doctors updates checks

on:
  pull_request:
    paths:
      - 'for-doctors/**'
      - 'en/for-doctors/**'
      - 'scripts/generate_doctors_updates.py'
      - 'scripts/inject_doctors_updates.py'
      - 'scripts/inject_doctor_retention.py'
      - 'scripts/publish_doctors_updates_telegram.py'
      - 'tests/test_generate_doctors_updates.py'
      - 'tests/test_doctors_updates_inject.py'
      - 'tests/doctors-updates.test.mjs'
      - 'tests/test_doctor_retention_inject.py'
      - 'tests/doctor-retention.test.mjs'
      - 'tests/test_publish_doctors_updates_telegram.py'
      - 'tests/test_professional_updates_page.py'
      - '.github/workflows/doctors-updates.yml'
      - '.github/workflows/inject-legal.yml'
      - '.github/workflows/publish-doctors-updates-telegram.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generator tests
        run: python -m unittest tests/test_generate_doctors_updates.py
      - name: Bell UI tests
        run: node --test tests/doctors-updates.test.mjs
      - name: Retention state tests
        run: node --test tests/doctor-retention.test.mjs
      - name: Retention injection tests
        run: python -m unittest tests/test_doctor_retention_inject.py
      - name: Telegram publisher tests
        run: python -m unittest tests/test_publish_doctors_updates_telegram.py
      - name: Professional updates page tests
        run: python -m unittest tests/test_professional_updates_page.py
      - name: Hub injection tests
        run: python -m unittest tests/test_doctors_updates_inject.py
      - name: Generate real clinician feed and inject hubs
        run: |
          python scripts/generate_doctors_updates.py
          python scripts/inject_doctors_updates.py
          python scripts/inject_doctor_retention.py
      - name: Validate generated clinician outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          feed=json.loads(Path('for-doctors/updates.json').read_text(encoding='utf-8'))
          ids={item['id'] for item in feed}
          assert {'bacterial-keratitis','penetrating-keratoplasty'} <= ids, ids
          assert 'professional-use' not in ids
          assert 'updates' not in ids
          assert len(ids)==len(feed)
          for item in feed:
              assert item['event_id']==f"{item['id']}:{item['revision']}"
              assert item['url'].startswith('/for-doctors/')
              if item['url_en']:
                  assert item['url_en'].startswith('/en/for-doctors/')
              assert item['kind'] in {'new','updated'}
              assert isinstance(item.get('topics'),list)
          for path in ('for-doctors/index.html','en/for-doctors/index.html'):
              text=Path(path).read_text(encoding='utf-8')
              assert text.count('id="doctors-updates"')==1
              assert text.count('/for-doctors/doctors-updates.css?v=20260816-1')==1
              assert text.count('/for-doctors/doctors-updates.js?v=20260816-1')==1
              assert text.count('id="doctor-workspace"')==1
              assert text.count('/for-doctors/doctor-retention.css?v=20260825-1')==1
              assert text.count('/for-doctors/doctor-retention.js?v=20260825-1')==1
          for path in ('for-doctors/bacterial-keratitis/index.html','en/for-doctors/bacterial-keratitis/index.html'):
              text=Path(path).read_text(encoding='utf-8')
              assert text.count('id="doctor-material-tools"')==1
              assert text.count('id="doctor-related-list"')==1
              assert text.count('/for-doctors/doctor-retention.css?v=20260825-1')==1
              assert text.count('/for-doctors/doctor-retention.js?v=20260825-1')==1
          print('Generated clinician feed items:',len(feed))
          PY
      - name: Syntax and existing navigation regressions
        run: |
          node --check for-doctors/doctors-updates.js
          node --test tests/doctors-updates.test.mjs
          node --check for-doctors/doctor-retention.js
          node --test tests/doctor-retention.test.mjs
          python -m unittest tests/test_publish_doctors_updates_telegram.py
          python -m unittest tests/test_professional_updates_page.py
          python -m unittest tests/test_site_mega_nav.py
          node --check site-mega-nav.js
          node tests/site-mega-nav.test.mjs
      - name: Render clinician hubs RU EN desktop mobile light dark
        run: |
          mkdir -p doctors-updates-smoke
          python - <<'PY'
          from pathlib import Path
          for filename in ('for-doctors/index.html','en/for-doctors/index.html'):
              path=Path(filename)
              text=path.read_text(encoding='utf-8')
              gate="<script>try{localStorage.setItem('medical_professional_audience_v1','confirmed')}catch(e){}</script>"
              opener="<script>addEventListener('load',()=>setTimeout(()=>document.getElementById('doctors-updates-toggle')?.click(),350))</script>"
              text=text.replace('<head>','<head>'+gate,1)
              text=text.replace('</body>',opener+'</body>',1)
              path.write_text(text,encoding='utf-8')
          PY
          python3 -m http.server 8000 >/tmp/doctors-updates-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          render() {
            name="$1"; size="$2"; url="$3"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=4000 --window-size="$size" --screenshot="doctors-updates-smoke/$name.png" "$url"
            test -s "doctors-updates-smoke/$name.png"
          }
          render_dark() {
            name="$1"; size="$2"; url="$3"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --run-all-compositor-stages-before-draw --virtual-time-budget=4000 --window-size="$size" --screenshot="doctors-updates-smoke/$name.png" "$url"
            test -s "doctors-updates-smoke/$name.png"
          }
          render ru-doctors-desktop 1440,1100 http://127.0.0.1:8000/for-doctors/
          render ru-doctors-mobile 390,844 http://127.0.0.1:8000/for-doctors/
          render en-doctors-desktop 1440,1100 http://127.0.0.1:8000/en/for-doctors/
          render en-doctors-mobile 390,844 http://127.0.0.1:8000/en/for-doctors/
          render_dark ru-doctors-desktop-dark 1440,1100 http://127.0.0.1:8000/for-doctors/
          render_dark ru-doctors-mobile-dark 390,844 http://127.0.0.1:8000/for-doctors/
          render_dark en-doctors-desktop-dark 1440,1100 http://127.0.0.1:8000/en/for-doctors/
          render_dark en-doctors-mobile-dark 390,844 http://127.0.0.1:8000/en/for-doctors/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8000/for-doctors/ > doctors-updates-smoke/ru-doctors-dom.html
          grep -q 'doctors-update-item' doctors-updates-smoke/ru-doctors-dom.html
          grep -q 'id="doctors-updates-panel"' doctors-updates-smoke/ru-doctors-dom.html
          grep -q 'id="doctor-workspace"' doctors-updates-smoke/ru-doctors-dom.html
          grep -q 'doctor-topic-chip' doctors-updates-smoke/ru-doctors-dom.html
      - name: Render full updates page RU EN
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=4000 --window-size=1440,1100 --dump-dom http://127.0.0.1:8000/for-doctors/updates/ > doctors-updates-smoke/ru-all-updates-dom.html
          grep -q 'id="doctor-all-updates-list"' doctors-updates-smoke/ru-all-updates-dom.html
          grep -q 'doctor-workspace-link' doctors-updates-smoke/ru-all-updates-dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=4000 --window-size=390,844 --screenshot="doctors-updates-smoke/en-all-updates-mobile.png" http://127.0.0.1:8000/en/for-doctors/updates/
          test -s doctors-updates-smoke/en-all-updates-mobile.png
      - name: Upload clinician update smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctors-updates-smoke
          path: doctors-updates-smoke/*
          if-no-files-found: error
