name: restore-iol-drive-media

on:
  push:
    paths:
      - '.github/workflows/restore-iol-drive-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify clinical WebP files
        run: |
          set -euo pipefail
          mkdir -p for-doctors/iol-dislocation/assets
          cat .tmp/iol-media/pt0 .tmp/iol-media/pt1 .tmp/iol-media/pt2 | base64 -d > for-doctors/iol-dislocation/assets/pupillary-capture-front.webp
          cat .tmp/iol-media/ft0 .tmp/iol-media/ft1 .tmp/iol-media/ft2 | base64 -d > for-doctors/iol-dislocation/assets/intrascleral-flange.webp
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {
              'for-doctors/iol-dislocation/assets/pupillary-capture-front.webp': (520, 690),
              'for-doctors/iol-dislocation/assets/intrascleral-flange.webp': (520, 690),
          }
          for name, size in expected.items():
              p = Path(name)
              with Image.open(p) as im:
                  im.load()
                  assert im.format == 'WEBP', (p, im.format)
                  assert im.size == size, (p, im.size)
              print(f'VERIFIED {p} bytes={p.stat().st_size} size={size[0]}x{size[1]}')
          PY
      - name: Commit restored media and remove staging files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add for-doctors/iol-dislocation/assets/pupillary-capture-front.webp for-doctors/iol-dislocation/assets/intrascleral-flange.webp
          git rm -r .tmp/iol-media
          git rm .github/workflows/restore-iol-drive-media.yml
          git commit -m 'fix: restore IOL clinical media from Drive'
          git push
