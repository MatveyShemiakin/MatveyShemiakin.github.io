name: Unified site header checks

on:
  pull_request:
    paths:
      - 'site-header-unified.js'
      - 'site-header-unified.css'
      - 'site-mega-nav.js'
      - 'scripts/inject_unified_header.py'
      - 'scripts/inject_site_mega_nav.py'
      - 'tests/test_unified_header_inject.py'
      - 'tests/test_unified_header_coverage.py'
      - 'tests/site-header-unified.test.mjs'
      - 'tests/site-mega-nav.test.mjs'
      - 'tests/theme-contrast-audit.html'
      - '.github/workflows/unified-header.yml'
      - '.github/workflows/inject-legal.yml'
      - '**/*.html'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unified header injector tests
        run: python -m unittest tests/test_unified_header_inject.py
      - name: Unified header runtime tests
        run: node --test tests/site-header-unified.test.mjs
      - name: Existing mega navigation regression
        run: node tests/site-mega-nav.test.mjs
      - name: Inject shared navigation layers into checkout
        run: |
          python scripts/inject_unified_header.py
          python scripts/inject_site_mega_nav.py
      - name: Global shared-header coverage
        run: python -m unittest tests/test_unified_header_coverage.py
      - name: Syntax checks
        run: |
          node --check site-header-unified.js
          node --check site-mega-nav.js
      - name: Render unified header matrix and run contrast audit
        run: |
          mkdir -p unified-header-smoke
          python - <<'PY'
          import json, os
          from pathlib import Path

          gate="<script>try{localStorage.setItem('medical_professional_audience_v1','confirmed')}catch(e){}</script>"
          for root in ('for-doctors','en/for-doctors'):
              base=Path(root)
              if not base.exists():
                  continue
              for path in base.rglob('*.html'):
                  text=path.read_text(encoding='utf-8')
                  if gate not in text and '<head>' in text:
                      text=text.replace('<head>','<head>'+gate,1)
                      path.write_text(text,encoding='utf-8')

          urls=[]
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.git','docs','tests'}]
              for name in files:
                  if not name.endswith('.html'):
                      continue
                  path=os.path.join(root,name).replace('\\','/').lstrip('./')
                  if path.startswith(('.github/','docs/','tests/')):
                      continue
                  if path=='index.html': url='/'
                  elif path.endswith('/index.html'): url='/'+path[:-10]
                  else: url='/'+path
                  urls.append(url)
          with open('visual-audit-pages.json','w',encoding='utf-8') as f:
              json.dump(sorted(set(urls)),f,ensure_ascii=False)
          PY
          python3 -m http.server 8000 >/tmp/unified-header-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"

          render() {
            name="$1"; size="$2"; url="$3"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=1800 --window-size="$size" --screenshot="unified-header-smoke/$name.png" "$url"
            test -s "unified-header-smoke/$name.png"
          }
          render_dark() {
            name="$1"; size="$2"; url="$3"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --run-all-compositor-stages-before-draw --virtual-time-budget=1800 --window-size="$size" --screenshot="unified-header-smoke/$name.png" "$url"
            test -s "unified-header-smoke/$name.png"
          }
          assert_dom() {
            name="$1"; url="$2"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=2200 --dump-dom "$url" > "unified-header-smoke/$name-dom.html"
            test "$(grep -o 'data-unified-site-header="true"' "unified-header-smoke/$name-dom.html" | wc -l)" -eq 1
            test "$(grep -o 'class="site-mega-nav"' "unified-header-smoke/$name-dom.html" | wc -l)" -le 1
            test "$(grep -o 'class="site-mobile-nav"' "unified-header-smoke/$name-dom.html" | wc -l)" -le 1
          }
          render_matrix() {
            prefix="$1"; path="$2"; url="http://127.0.0.1:8000$path"
            render "$prefix-desktop-light" 1440,1050 "$url"
            render "$prefix-mobile-light" 390,844 "$url"
            render_dark "$prefix-desktop-dark" 1440,1050 "$url"
            render_dark "$prefix-mobile-dark" 390,844 "$url"
            assert_dom "$prefix" "$url"
          }

          render_matrix ru-home /
          render_matrix en-home /en/
          render_matrix ru-patients /patients/
          render_matrix en-patients /en/patients/
          render_matrix ru-cataract /patients/cataract/
          render_matrix en-cataract /en/patients/cataract/
          render_matrix ru-doctors /for-doctors/
          render_matrix en-doctors /en/for-doctors/
          render_matrix ru-keratitis /for-doctors/bacterial-keratitis/
          render_matrix en-keratitis /en/for-doctors/bacterial-keratitis/
          render_matrix ru-events /for-doctors/events/
          render_matrix en-events /en/for-doctors/events/
          render_matrix ru-collaboration /collaboration/
          render_matrix en-collaboration /en/collaboration/

          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=90000 --dump-dom http://127.0.0.1:8000/tests/theme-contrast-audit.html > unified-header-smoke/theme-contrast-audit.html
          grep -q 'data-audit-status="pass"' unified-header-smoke/theme-contrast-audit.html
      - name: Upload unified header visual smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-site-header-smoke
          path: unified-header-smoke/*
          if-no-files-found: error
