name: Unified site header checks

on:
  pull_request:
    paths:
      - 'site-header-unified.js'
      - 'site-header-unified.css'
      - 'site-mega-nav.js'
      - 'scripts/inject_unified_header.py'
      - 'tests/test_unified_header_inject.py'
      - 'tests/site-header-unified.test.mjs'
      - 'tests/site-mega-nav.test.mjs'
      - '.github/workflows/unified-header.yml'
      - '.github/workflows/inject-legal.yml'
      - '**/*.html'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unified header injector tests
        run: python -m unittest tests/test_unified_header_inject.py
      - name: Unified header runtime tests
        run: node --test tests/site-header-unified.test.mjs
      - name: Existing mega navigation regression
        run: node tests/site-mega-nav.test.mjs
