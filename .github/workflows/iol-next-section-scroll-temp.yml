name: IOL next-section scroll TDD

on:
  push:
    branches:
      - fix/iol-next-section-scroll
    paths:
      - 'patients/iol-dislocation/script.js'
      - 'tests/*.test.mjs'
      - '.github/workflows/iol-next-section-scroll-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: node --check patients/iol-dislocation/script.js
      - name: Run regression suite
        run: |
          for test in tests/*.test.mjs; do
            node --test "$test"
          done
