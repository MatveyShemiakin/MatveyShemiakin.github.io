name: Fix final PKP layout

on:
  push:
    paths:
      - '.github/workflows/fix-pkp-final-layout.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Fix PKP final layout [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply deterministic layout corrections
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              Path('for-doctors/penetrating-keratoplasty/index.html'),
              Path('en/for-doctors/penetrating-keratoplasty/index.html'),
          ]

          css = r'''
          /* PKP_FINAL_HERO_LAYOUT_START */
          .hero-inner{
            grid-template-columns:minmax(0,1.08fr) minmax(360px,.82fr)!important;
            gap:44px!important;
            align-items:center!important;
          }
          .hero-portrait{
            width:100%!important;
            aspect-ratio:4/3!important;
            min-height:0!important;
            align-self:center!important;
            border-radius:26px!important;
            background:#07172c!important;
          }
          .hero-portrait img{
            width:100%!important;
            height:100%!important;
            min-height:0!important;
            object-fit:contain!important;
            object-position:center!important;
            background:#07172c!important;
          }
          .hero-portrait-shade{display:none!important;}
          @media (max-width:980px){
            .hero-inner{grid-template-columns:minmax(0,1fr) minmax(320px,.78fr)!important;gap:32px!important;}
            .hero-portrait,.hero-portrait img{min-height:0!important;}
          }
          @media (max-width:760px){
            .hero-inner{grid-template-columns:1fr!important;}
            .hero-portrait{width:min(100%,620px)!important;justify-self:center!important;aspect-ratio:4/3!important;}
            .hero-portrait,.hero-portrait img{min-height:0!important;}
          }
          /* PKP_FINAL_HERO_LAYOUT_END */
          '''

          def set_figure_image(text, class_name, src, alt):
              pattern = rf'(<figure\b[^>]*class="[^"]*\b{re.escape(class_name)}\b[^"]*"[^>]*>.*?<img\b)([^>]*)(>)'
              match = re.search(pattern, text, flags=re.S | re.I)
              if not match:
                  raise RuntimeError(f'Missing figure: {class_name}')
              attrs = match.group(2)
              if re.search(r'\bsrc="[^"]*"', attrs, flags=re.I):
                  attrs = re.sub(r'\bsrc="[^"]*"', f'src="{src}"', attrs, count=1, flags=re.I)
              else:
                  attrs += f' src="{src}"'
              if re.search(r'\balt="[^"]*"', attrs, flags=re.I):
                  attrs = re.sub(r'\balt="[^"]*"', f'alt="{alt}"', attrs, count=1, flags=re.I)
              else:
                  attrs += f' alt="{alt}"'
              return text[:match.start()] + match.group(1) + attrs + match.group(3) + text[match.end():]

          for page in pages:
              text = page.read_text(encoding='utf-8')
              text = re.sub(
                  r'/\* PKP_FINAL_HERO_LAYOUT_START \*/.*?/\* PKP_FINAL_HERO_LAYOUT_END \*/',
                  '', text, flags=re.S
              )
              if '</style>' not in text:
                  raise RuntimeError(f'Inline style block not found: {page}')
              text = text.replace('</style>', css + '\n</style>', 1)
              text = set_figure_image(
                  text,
                  'hero-portrait',
                  '/for-doctors/penetrating-keratoplasty/assets/images/hero-corneal-graft.jpg',
                  'Clinical photograph of a penetrating corneal graft'
              )
              text = set_figure_image(
                  text,
                  'author-portrait',
                  '/assets/portrait.jpg',
                  'Matvey Yuryevich Shemyakin'
              )
              text = re.sub(r'<button\b[^>]*data-print[^>]*>.*?</button>', '', text, flags=re.S | re.I)
              text = re.sub(
                  r'document\.querySelector\([^\n;]*data-print[^\n;]*\)\?\.addEventListener\([^;]*;',
                  '', text
              )
              page.write_text(text, encoding='utf-8')

      - name: Commit published correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add for-doctors/penetrating-keratoplasty/index.html en/for-doctors/penetrating-keratoplasty/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix PKP final layout [skip ci]"
          git push
