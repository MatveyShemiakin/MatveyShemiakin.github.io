name: sync-iol-clinical-media
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-iol-clinical-media.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original clinical media from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p for-doctors/iol-dislocation/assets
          python - <<'PY'
          import urllib.request, http.cookiejar, re
          files = {
            'iol-haptic-pupil.jpg':'1GusMCp3iK8i6Kac8zAg6JDq2v9QXPwBS',
            'iol-optic-edge-pupil.jpg':'1W4Lg0v4b-KrHFFfeWg8hXOx5YuwFo11c',
            'pupillary-capture-front.jpg':'1ln2wPsBe0gDq65kTOGqYUmoTUX3LWoAN',
            'pupillary-capture-side.jpg':'1BuTO5t-S29SOlsGR7OX-rDzA6Dhay_LH',
            'intrascleral-flange.jpg':'1ecqWAc8hwmXcZUJ670vcsQXwmgG25P7n',
            'three-point-corneoscleral-fixation.jpg':'1VR1agq7ePS7QGxhHz86MXwkDlQN4jVsA',
            'dislocated-iol-glaucoma.jpg':'1E9YvsYOk0nOhZ_Sz7yuWA0N9gs2UVB3h',
            'pupillary-capture.mp4':'1ck_g-ve03LSrocj6DBGls2hzb8RA98BK',
          }
          def download(fid, dest):
              cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
              url=f'https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t'
              data=op.open(url).read()
              if data[:4] not in (b'\xff\xd8\xff\xe0',b'\xff\xd8\xff\xe1') and b'ftyp' not in data[:64]:
                  text=data.decode('utf-8','ignore')
                  m=re.search(r'href="([^"]*confirm=[^"]*)"',text)
                  if m:
                      import html
                      data=op.open(html.unescape(m.group(1))).read()
              open(dest,'wb').write(data)
          for name,fid in files.items():
              print('Downloading',name); download(fid,'for-doctors/iol-dislocation/assets/'+name)
          PY
      - name: Verify originals without recompression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names=['iol-haptic-pupil.jpg','iol-optic-edge-pupil.jpg','pupillary-capture-front.jpg','pupillary-capture-side.jpg','intrascleral-flange.jpg','three-point-corneoscleral-fixation.jpg','dislocated-iol-glaucoma.jpg']
          base=Path('for-doctors/iol-dislocation/assets')
          for n in names:
              p=base/n
              with Image.open(p) as im: im.verify()
              with Image.open(p) as im: assert im.size==(3072,4080),(p,im.size)
              print('VERIFIED',p,p.stat().st_size)
          PY
          test "$(stat -c%s for-doctors/iol-dislocation/assets/pupillary-capture.mp4)" -eq 27150836
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 for-doctors/iol-dislocation/assets/pupillary-capture.mp4 | grep -q '^hevc,1920,1080$'
      - name: Commit exact source media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add for-doctors/iol-dislocation/assets/*.jpg for-doctors/iol-dislocation/assets/pupillary-capture.mp4
          git rm .github/workflows/sync-iol-clinical-media.yml
          git commit -m 'media: publish full-quality IOL clinical set'
          git push
