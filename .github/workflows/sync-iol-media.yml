name: sync-iol-media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-iol-media.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth pillow

      - name: Download originals from Google Drive
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p for-doctors/iol-dislocation/assets
          python - <<'PY'
          import json, os
          from pathlib import Path
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          files = {
              'iol-haptic-pupil.jpg': '1GusMCp3iK8i6Kac8zAg6JDq2v9QXPwBS',
              'iol-optic-edge-pupil.jpg': '1W4Lg0v4b-KrHFFfeWg8hXOx5YuwFo11c',
              'pupillary-capture-front.jpg': '1ln2wPsBe0gDq65kTOGqYUmoTUX3LWoAN',
              'pupillary-capture-side.jpg': '1BuTO5t-S29SOlsGR7OX-rDzA6Dhay_LH',
              'intrascleral-flange.jpg': '1ecqWAc8hwmXcZUJ670vcsQXwmgG25P7n',
              'three-point-corneoscleral-fixation.jpg': '1VR1agq7ePS7QGxhHz86MXwkDlQN4jVsA',
              'dislocated-iol-glaucoma.jpg': '1E9YvsYOk0nOhZ_Sz7yuWA0N9gs2UVB3h',
              'pupillary-capture.mp4': '1ck_g-ve03LSrocj6DBGls2hzb8RA98BK',
          }

          raw = os.environ.get('GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON', '').strip()
          if not raw:
              raise SystemExit('GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON is empty')
          info = json.loads(raw)
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/drive.readonly'],
          )
          service = build('drive', 'v3', credentials=creds, cache_discovery=False)
          out = Path('for-doctors/iol-dislocation/assets')

          for name, file_id in files.items():
              meta = service.files().get(fileId=file_id, fields='id,name,mimeType,size').execute()
              request = service.files().get_media(fileId=file_id)
              target = out / name
              with target.open('wb') as fh:
                  downloader = MediaIoBaseDownload(fh, request, chunksize=8 * 1024 * 1024)
                  done = False
                  while not done:
                      _, done = downloader.next_chunk()
              actual = target.stat().st_size
              expected = int(meta.get('size', actual))
              if actual != expected:
                  raise RuntimeError(f'{name}: size mismatch {actual} != {expected}')
              print(f'DOWNLOADED {name} {actual} bytes from {meta["name"]}')
          PY

      - name: Validate media integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          base = Path('for-doctors/iol-dislocation/assets')
          photos = [
              'iol-haptic-pupil.jpg',
              'iol-optic-edge-pupil.jpg',
              'pupillary-capture-front.jpg',
              'pupillary-capture-side.jpg',
              'intrascleral-flange.jpg',
              'three-point-corneoscleral-fixation.jpg',
              'dislocated-iol-glaucoma.jpg',
          ]
          for name in photos:
              p = base / name
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  if im.width < 2000 or im.height < 2000:
                      raise RuntimeError(f'{name}: unexpected low resolution {im.size}')
                  print('VERIFIED', name, im.size, p.stat().st_size)

          video = base / 'pupillary-capture.mp4'
          data = video.read_bytes()[:64]
          if b'ftyp' not in data:
              raise RuntimeError('pupillary-capture.mp4: invalid MP4 header')
          if video.stat().st_size < 20_000_000:
              raise RuntimeError(f'pupillary-capture.mp4: unexpectedly small {video.stat().st_size}')
          print('VERIFIED', video.name, video.stat().st_size)
          PY

      - name: Update IOL page media markup
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          page = Path('for-doctors/iol-dislocation/index.html')
          html = page.read_text(encoding='utf-8')

          html = html.replace('assets/iol-haptic-pupil.webp', 'assets/iol-haptic-pupil.jpg')
          html = html.replace('assets/pupillary-capture-front.webp', 'assets/pupillary-capture-front.jpg')
          html = html.replace('assets/intrascleral-flange.webp', 'assets/intrascleral-flange.jpg')
          html = html.replace('assets/dislocated-iol-glaucoma.webp', 'assets/dislocated-iol-glaucoma.jpg')

          photo2 = '<figure class="clinical-figure" data-clinical-media="optic-edge"><div class="clinical-photo protected-media"><img src="assets/iol-optic-edge-pupil.jpg" alt="Дислокация ИОЛ: край оптики в просвете зрачка" data-lightbox loading="lazy"></div><figcaption><span class="figure-label">Клиническое фото 2</span>Дислокация ИОЛ: край оптики визуализируется в просвете зрачка.</figcaption></figure>'
          if 'data-clinical-media="optic-edge"' not in html:
              needle = '</tbody></table></div></section><section class="section-card red-flags" id="urgent">'
              if needle not in html:
                  raise RuntimeError('diagnostics insertion point not found')
              html = html.replace(needle, '</tbody></table></div>' + photo2 + '</section><section class="section-card red-flags" id="urgent">', 1)

          photo4 = '<figure class="clinical-figure" data-clinical-media="pupillary-capture-side"><div class="clinical-photo protected-media"><img src="assets/pupillary-capture-side.jpg" alt="Ущемление дислоцированной ИОЛ в зрачке, боковой вид" data-lightbox loading="lazy"></div><figcaption><span class="figure-label">Клиническое фото 4</span>Ущемление дислоцированной ИОЛ в зрачке — боковой вид.</figcaption></figure>'
          video = '<div class="video-shell" data-clinical-media="pupillary-video"><div class="video-frame protected-media"><video controls muted playsinline preload="metadata" poster="assets/pupillary-capture-front.jpg" aria-label="Видео ущемления вывихнутой ИОЛ в зрачке"><source src="assets/pupillary-capture.mp4" type="video/mp4">Ваш браузер не поддерживает видео.</video></div><div class="video-caption"><strong>Видео: ущемление вывихнутой ИОЛ в зрачке <span class="silent-badge">без звука</span></strong>Клинический видеоматериал из архива автора.</div></div>'
          if 'data-clinical-media="pupillary-capture-side"' not in html:
              needle = '</figcaption></figure></section><section class="section-card" id="surgery-indications">'
              pos = html.find(needle, html.find('data-clinical-media="pupillary-capture"'))
              if pos < 0:
                  raise RuntimeError('urgent insertion point not found')
              html = html[:pos] + '</figcaption></figure>' + photo4 + video + html[pos + len('</figcaption></figure>'):]

          photo6 = '<figure class="clinical-figure" data-clinical-media="three-point-fixation"><div class="clinical-photo protected-media"><img src="assets/three-point-corneoscleral-fixation.jpg" alt="Трёхточечная корнеосклеральная фиксация ИОЛ" data-lightbox loading="lazy"></div><figcaption><span class="figure-label">Клиническое фото 6</span>Трёхточечная корнеосклеральная фиксация ИОЛ.</figcaption></figure>'
          if 'data-clinical-media="three-point-fixation"' not in html:
              start = html.find('data-clinical-media="intrascleral-flange"')
              needle = '</figcaption></figure><div class="disclaimer">'
              pos = html.find(needle, start)
              if pos < 0:
                  raise RuntimeError('fixation insertion point not found')
              html = html[:pos] + '</figcaption></figure>' + photo6 + html[pos + len('</figcaption></figure>'):]

          html = html.replace('<span class="figure-label">Клиническое фото 5</span>Интрасклеральный фланцевый элемент фиксации: оценивать положение относительно роговицы, конъюнктивы и предполагаемой оси фиксации.', '<span class="figure-label">Клиническое фото 5</span>Интрасклеральная нить с фланцем в парацентезе.')
          html = html.replace('media.css?v=20260825-2', 'media.css?v=20260826-1')
          html = html.replace('script.js?v=20260825-4', 'script.js?v=20260826-1')

          for i in range(1, 8):
              if f'Клиническое фото {i}' not in html:
                  raise RuntimeError(f'clinical photo label {i} missing')
          for asset in [
              'iol-haptic-pupil.jpg','iol-optic-edge-pupil.jpg','pupillary-capture-front.jpg',
              'pupillary-capture-side.jpg','intrascleral-flange.jpg',
              'three-point-corneoscleral-fixation.jpg','dislocated-iol-glaucoma.jpg','pupillary-capture.mp4'
          ]:
              if f'assets/{asset}' not in html:
                  raise RuntimeError(f'asset reference missing: {asset}')

          page.write_text(html, encoding='utf-8')

          css = Path('for-doctors/iol-dislocation/media.css')
          text = css.read_text(encoding='utf-8')
          if '.video-frame{' not in text:
              text += '.video-frame{position:relative;overflow:hidden;background:#07172c}.video-frame video{position:relative;z-index:1}'
          css.write_text(text, encoding='utf-8')
          print('PAGE MEDIA MARKUP VERIFIED: 7 photos + video')
          PY

      - name: Commit exact originals and page markup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add for-doctors/iol-dislocation/assets/*.jpg \
                  for-doctors/iol-dislocation/assets/pupillary-capture.mp4 \
                  for-doctors/iol-dislocation/index.html \
                  for-doctors/iol-dislocation/media.css
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'media: publish complete IOL clinical set'
          git push
