name: diagnose-iol-media

on:
  push:
    paths:
      - '.github/workflows/diagnose-iol-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Inspect clinical images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          root=Path('for-doctors/iol-dislocation/assets')
          names=['iol-haptic-pupil.webp','pupillary-capture-front.webp','intrascleral-flange.webp','dislocated-iol-glaucoma.webp']
          for name in names:
              p=root/name
              im=Image.open(p).convert('RGB')
              stat=ImageStat.Stat(im)
              print(name)
              print(' size=', im.size, 'bytes=', p.stat().st_size)
              print(' extrema=', im.getextrema())
              print(' mean=', tuple(round(v,2) for v in stat.mean))
              print(' rms=', tuple(round(v,2) for v in stat.rms))
              thumb=im.copy(); thumb.thumbnail((120,120))
              tstat=ImageStat.Stat(thumb)
              print(' thumb_mean=', tuple(round(v,2) for v in tstat.mean))
          PY
