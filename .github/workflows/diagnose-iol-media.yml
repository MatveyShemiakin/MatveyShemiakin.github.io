name: diagnose-iol-media

on:
  push:
    paths:
      - '.github/workflows/diagnose-iol-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search reachable blobs for embedded complete WebP data URIs
        run: |
          python - <<'PY'
          import base64, re, subprocess, struct
          from pathlib import Path

          targets = [
              Path('for-doctors/iol-dislocation/assets/pupillary-capture-front.webp'),
              Path('for-doctors/iol-dislocation/assets/intrascleral-flange.webp'),
          ]

          rows=[]
          seen=set()
          for line in subprocess.check_output(['git','rev-list','--objects','--all'], text=True).splitlines():
              parts=line.split(' ',1); sha=parts[0]; path=parts[1] if len(parts)>1 else ''
              if sha in seen: continue
              seen.add(sha)
              try:
                  if subprocess.check_output(['git','cat-file','-t',sha], text=True, stderr=subprocess.DEVNULL).strip()!='blob': continue
                  size=int(subprocess.check_output(['git','cat-file','-s',sha], text=True).strip())
                  if size < 1000 or size > 25_000_000: continue
                  data=subprocess.check_output(['git','cat-file','blob',sha])
              except Exception:
                  continue
              rows.append((sha,path,data))

          for target in targets:
              prefix=target.read_bytes()
              marker=base64.b64encode(prefix[:120])
              print(f'=== {target} prefix_bytes={len(prefix)} marker={marker[:32].decode()}... ===')
              found=0
              for sha,path,data in rows:
                  pos=data.find(marker)
                  if pos<0: continue
                  start=data.rfind(b'data:image/webp;base64,',0,pos)
                  if start<0: continue
                  payload_start=start+len(b'data:image/webp;base64,')
                  # base64 data ends before the next quote/apostrophe/angle bracket/whitespace
                  m=re.search(br'[\"\'\s<]', data[payload_start:])
                  if not m: continue
                  payload=data[payload_start:payload_start+m.start()]
                  try: decoded=base64.b64decode(payload, validate=True)
                  except Exception: continue
                  if not decoded.startswith(prefix) or len(decoded)<=len(prefix): continue
                  declared=None
                  if decoded[:4]==b'RIFF' and decoded[8:12]==b'WEBP':
                      declared=struct.unpack('<I',decoded[4:8])[0]+8
                  print(f'EMBEDDED_MATCH sha={sha} path={path} decoded_bytes={len(decoded)} declared_bytes={declared}')
                  found+=1
              if not found:
                  print('NO_EMBEDDED_MATCH')
          PY
