name: diagnose-iol-media

on:
  push:
    paths:
      - '.github/workflows/diagnose-iol-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find complete media blobs in reachable history
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          targets = [
              Path('for-doctors/iol-dislocation/assets/pupillary-capture-front.webp'),
              Path('for-doctors/iol-dislocation/assets/intrascleral-flange.webp'),
          ]

          objects = []
          for line in subprocess.check_output(['git','rev-list','--objects','--all'], text=True).splitlines():
              parts = line.split(' ', 1)
              sha = parts[0]
              path = parts[1] if len(parts) > 1 else ''
              objects.append((sha, path))

          for target in targets:
              prefix = target.read_bytes()
              print(f'=== TARGET {target} current_bytes={len(prefix)} ===')
              matches = []
              seen = set()
              for sha, path in objects:
                  if sha in seen:
                      continue
                  seen.add(sha)
                  try:
                      typ = subprocess.check_output(['git','cat-file','-t',sha], text=True, stderr=subprocess.DEVNULL).strip()
                      if typ != 'blob':
                          continue
                      size = int(subprocess.check_output(['git','cat-file','-s',sha], text=True).strip())
                      if size <= len(prefix):
                          continue
                      data = subprocess.check_output(['git','cat-file','blob',sha])
                  except Exception:
                      continue
                  if data.startswith(prefix):
                      matches.append((sha, size, path))
              if matches:
                  for sha, size, path in sorted(matches, key=lambda x: x[1]):
                      print(f'MATCH sha={sha} size={size} path={path}')
              else:
                  print('NO_FULL_PREFIX_MATCH')
          PY
