name: Verify events view switch fix

on:
  push:
    branches:
      - fix/events-view-switch
    paths:
      - '.github/workflows/verify-events-view-switch.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/events-view-switch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check assets/events/events.js
      - name: Verify RU EN desktop mobile view switching
        run: |
          python3 -m http.server 8000 >/tmp/events-verify-http.log 2>&1 &
          SERVER_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/events-view-verify about:blank >/tmp/events-verify-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $SERVER_PID $CHROME_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break; sleep 1; done
          node scripts/test-events-view-switch.mjs
