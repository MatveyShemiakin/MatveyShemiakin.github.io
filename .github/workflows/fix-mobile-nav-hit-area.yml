name: Fix mobile navbar hit area

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-nav-hit-area.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce blocked right-side buttons
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const css=fs.readFileSync('mobile-nav.css','utf8');
          assert.match(
            css,
            /@media\(max-width:760px\)[\s\S]*?\.patient-fab\{[^}]*pointer-events:none!important/,
            'The floating-action wrapper still intercepts taps above the mobile navbar'
          );
          assert.match(
            css,
            /\.patient-fab__main\{[^}]*pointer-events:auto!important/,
            'The visible floating-action button must remain clickable'
          );
          NODE
