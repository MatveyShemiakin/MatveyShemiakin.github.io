name: Fix mobile navbar hit area

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-nav-hit-area.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal pointer-event fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          css_path = Path('mobile-nav.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* MOBILE_NAV_HIT_AREA_FIX_V2 */'
          patch = '''

          /* MOBILE_NAV_HIT_AREA_FIX_V2 */
          @media(max-width:760px){
            .patient-fab{pointer-events:none!important}
            .patient-fab__main,.patient-fab.is-open .patient-fab__menu,.patient-fab.is-open .patient-fab__action{pointer-events:auto!important}
          }
          '''
          if marker not in css:
              css_path.write_text(css.rstrip() + patch, encoding='utf-8')

          for path in Path('.').rglob('*.html'):
              if any(part.startswith('.') for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('/mobile-nav.css?v=20260806-1', '/mobile-nav.css?v=20260806-2')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          injector = Path('scripts/inject_mobile_nav.py')
          text = injector.read_text(encoding='utf-8')
          injector.write_text(text.replace('/mobile-nav.css?v=20260806-1', '/mobile-nav.css?v=20260806-2'), encoding='utf-8')

          test = Path('tests/mobile-navbar.test.mjs')
          text = test.read_text(encoding='utf-8').replace('/mobile-nav\\.css\\?v=20260806-1', '/mobile-nav\\.css\\?v=20260806-2')
          checks = '''
          assert.match(css,/@media\\(max-width:760px\\)[\\s\\S]*?\\.patient-fab\\{pointer-events:none!important\\}/);
          assert.match(css,/\\.patient-fab__main,\\.patient-fab\\.is-open \\.patient-fab__menu,\\.patient-fab\\.is-open \\.patient-fab__action\\{pointer-events:auto!important\\}/);
          '''
          if 'pointer-events:none!important' not in text:
              text = text.replace("assert.match(css,/\\.cookie-banner\\{bottom:calc\\(104px/);\n", "assert.match(css,/\\.cookie-banner\\{bottom:calc\\(104px/);\n" + checks)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Verify fix and regressions
        run: |
          node --check mobile-nav.js
          node tests/mobile-navbar.test.mjs
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const css=fs.readFileSync('mobile-nav.css','utf8');
          assert.match(css,/@media\(max-width:760px\)[\s\S]*?\.patient-fab\{pointer-events:none!important\}/);
          assert.match(css,/\.patient-fab__main,\.patient-fab\.is-open \.patient-fab__menu,\.patient-fab\.is-open \.patient-fab__action\{pointer-events:auto!important\}/);
          for(const file of ['index.html','patients/index.html','patients/iol-dislocation/index.html','en/index.html','en/patients/iol-dislocation/index.html']){
            const html=fs.readFileSync(file,'utf8');
            assert.equal((html.match(/\/mobile-nav\.css\?v=20260806-2/g)||[]).length,1,`Cache-busted CSS missing in ${file}`);
          }
          NODE
          python3 -m py_compile scripts/inject_mobile_nav.py
          git diff --check

      - name: Commit and publish site files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-nav.css scripts/inject_mobile_nav.py tests/mobile-navbar.test.mjs
          git add '*.html' '**/*.html'
          git diff --cached --check
          git commit -m 'Fix blocked mobile navbar actions'
          git push origin main
