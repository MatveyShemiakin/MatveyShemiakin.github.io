name: Apply final events header fix
on:
  push:
    branches: [fix/events-header-nav-final]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('doctors-legal.js')
          s=p.read_text(encoding='utf-8')
          old="header.querySelector('.nav-links,.clinical-section-nav')"
          new="header.querySelector('.nav-links,.clinical-section-nav,.nav-right > nav')"
          assert old in s or new in s
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('scripts/inject_legal.py')
          s=p.read_text(encoding='utf-8').replace('/doctors-legal.js?v=20260805-1','/doctors-legal.js?v=20260816-2')
          p.write_text(s,encoding='utf-8')

          css=Path('assets/events/events.css')
          s=css.read_text(encoding='utf-8')
          guard='''\n/* Events pages use the shared mega navigation as their single desktop navigation. */\n.site-header.site-mega-nav-mounted .nav-right > nav:not(.site-mega-nav),\n.site-header .nav-right:has(> .site-mega-nav) > nav:not(.site-mega-nav){display:none!important}\n@media(min-width:1021px){\n  .site-header.site-mega-nav-mounted .nav-right{min-width:0;flex:1 1 auto}\n  .site-header.site-mega-nav-mounted .nav{gap:20px}\n}\n'''
          if 'Events pages use the shared mega navigation as their single desktop navigation' not in s:
              s += guard
          css.write_text(s,encoding='utf-8')

          for path in [Path('for-doctors/events/index.html'),Path('en/for-doctors/events/index.html')]:
              s=path.read_text(encoding='utf-8')
              s=s.replace('/doctors-legal.js?v=20260805-1','/doctors-legal.js?v=20260816-2')
              s=s.replace('/assets/events/events.css"','/assets/events/events.css?v=20260816-2"')
              s=s.replace('/assets/events/events.css?v=20260816-1"','/assets/events/events.css?v=20260816-2"')
              path.write_text(s,encoding='utf-8')
          PY
      - name: Verify rendered RU and EN DOM
        run: |
          node --check doctors-legal.js
          node --check site-mega-nav.js
          python3 -m http.server 8000 >/tmp/events-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p /tmp/events-final
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8000/for-doctors/events/ > /tmp/events-final/ru.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8000/en/for-doctors/events/ > /tmp/events-final/en.html
          for f in /tmp/events-final/ru.html /tmp/events-final/en.html; do
            grep -q 'class="site-mega-nav"' "$f"
            test "$(grep -o 'class="clinical-section-nav"' "$f" | wc -l)" -eq 0
          done
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-events-header-final.yml
          git add doctors-legal.js scripts/inject_legal.py assets/events/events.css for-doctors/events/index.html en/for-doctors/events/index.html .github/workflows/apply-events-header-final.yml
          git commit -m "Fix duplicate navigation on events pages"
          git push