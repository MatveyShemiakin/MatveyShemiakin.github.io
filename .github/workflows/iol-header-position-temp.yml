name: IOL header position regression

on:
  push:
    branches:
      - fix/iol-header-photo-lower
    paths:
      - 'patients/iol-dislocation/header-photo.css'
      - 'patients/iol-dislocation/index.html'
      - 'en/patients/iol-dislocation/index.html'
      - 'tests/iol-header-photo.test.mjs'
      - '.github/workflows/iol-header-position-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh IOL header stylesheet cache key
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '/patients/iol-dislocation/header-photo.css?v=20260806-1'
          new = '/patients/iol-dislocation/header-photo.css?v=20260806-2'
          paths = (
              Path('patients/iol-dislocation/index.html'),
              Path('en/patients/iol-dislocation/index.html'),
          )

          for path in paths:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, new, 1)
              if text.count(new) != 1 or old in text:
                  raise SystemExit(f'{path}: invalid header-photo stylesheet reference')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regression suite
        run: |
          node --test tests/iol-header-photo.test.mjs
          node --test tests/iol-next-section-scroll.test.mjs
          node --test tests/mobile-navbar.test.mjs

      - name: Commit cache-key refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patients/iol-dislocation/index.html en/patients/iol-dislocation/index.html
          git commit -m "Refresh IOL header photo stylesheet cache key"
          git push
