name: Apply IOL images

on:
  push:
    paths:
      - '.github/workflows/apply-iol-images.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patients/iol-dislocation/assets
          cat .github/iol-image-payload/normal-*.txt | base64 -d > patients/iol-dislocation/assets/iol-normal-vs-dislocation-capsular-bag.avif
          cat .github/iol-image-payload/degrees-*.txt | base64 -d > patients/iol-dislocation/assets/iol-displacement-degrees.avif
          echo '41de70c2e8082505420992358a3888a157c9b2e78559653203cdad925e33045c  patients/iol-dislocation/assets/iol-normal-vs-dislocation-capsular-bag.avif' | sha256sum -c -
          echo 'efffb1b4630e4179491b4405b6833d0b4be41fb18f7cc81f052a085b66e4377b  patients/iol-dislocation/assets/iol-displacement-degrees.avif' | sha256sum -c -

      - name: Insert figures and lightbox
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('patients/iol-dislocation')
          html_path = root / 'index.html'
          css_path = root / 'styles.css'
          js_path = root / 'script.js'

          html = html_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')

          first_figure = '''<figure class="iol-figure">
          <button class="iol-image-button" type="button" data-iol-lightbox="/patients/iol-dislocation/assets/iol-normal-vs-dislocation-capsular-bag.avif" aria-label="Увеличить схему нормального положения и дислокации ИОЛ">
          <img src="/patients/iol-dislocation/assets/iol-normal-vs-dislocation-capsular-bag.avif" alt="Нормальное положение ИОЛ в капсульном мешке и дислокация ИОЛ" width="1100" height="825" loading="lazy" decoding="async"/>
          <span class="iol-zoom-hint" aria-hidden="true">⌕</span>
          </button>
          <figcaption>Нажмите на изображение, чтобы увеличить.</figcaption>
          </figure>'''

          second_figure = '''<figure class="iol-figure">
          <button class="iol-image-button" type="button" data-iol-lightbox="/patients/iol-dislocation/assets/iol-displacement-degrees.avif" aria-label="Увеличить схему степеней смещения ИОЛ">
          <img src="/patients/iol-dislocation/assets/iol-displacement-degrees.avif" alt="Подвывих ИОЛ и выраженная дислокация ИОЛ" width="1100" height="825" loading="lazy" decoding="async"/>
          <span class="iol-zoom-hint" aria-hidden="true">⌕</span>
          </button>
          <figcaption>Нажмите на изображение, чтобы увеличить.</figcaption>
          </figure>'''

          dialog = '''<dialog class="iol-lightbox" data-iol-lightbox-modal aria-label="Увеличенное медицинское изображение"><div class="iol-lightbox__frame"><button class="iol-lightbox__close" type="button" data-iol-lightbox-close aria-label="Закрыть увеличенное изображение">×</button><img class="iol-lightbox__image" alt=""/></div></dialog>'''

          def details_block(source: str, item_id: str):
              start = source.index(f'id="{item_id}"')
              start = source.rfind('<details', 0, start)
              end = source.index('</details>', start) + len('</details>')
              return start, end, source[start:end]

          if 'iol-normal-vs-dislocation-capsular-bag.avif' not in html:
              start, end, block = details_block(html, 'symptoms-q1')
              updated, count = re.subn(r'<aside class="visual-brief">.*?</aside>', first_figure, block, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError('Не найден блок изображения в вопросе 01')
              html = html[:start] + updated + html[end:]

          if 'iol-displacement-degrees.avif' not in html:
              start, end, block = details_block(html, 'diagnostics-q3')
              closing = re.search(r'</div>\s*</details>\s*$', block)
              if not closing:
                  raise RuntimeError('Не найдено место вставки в разделе об операции')
              block = block[:closing.start()] + second_figure + block[closing.start():]
              html = html[:start] + block + html[end:]

          if 'data-iol-lightbox-modal' not in html:
              html = html.replace('</body>', dialog + '</body>', 1)

          html = html.replace('/patients/iol-dislocation/styles.css?v=20260806-1', '/patients/iol-dislocation/styles.css?v=20260806-2')
          html = html.replace('/patients/iol-dislocation/script.js?v=20260806-2', '/patients/iol-dislocation/script.js?v=20260806-3')

          css_block = r'''
          /* IOL IMAGE LIGHTBOX 2026-08-06 */
          .iol-figure{grid-column:1/-1;margin:18px 0 0;border:1px solid rgba(50,111,222,.22);border-radius:18px;overflow:hidden;background:#fff}
          .iol-image-button{position:relative;display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}
          .iol-image-button img{display:block;width:100%;height:auto}
          .iol-zoom-hint{position:absolute;right:14px;bottom:14px;display:grid;width:44px;height:44px;place-items:center;border:1px solid rgba(255,255,255,.75);border-radius:50%;background:rgba(6,24,47,.82);color:#fff;font-size:24px;line-height:1;box-shadow:0 6px 18px rgba(6,24,47,.22)}
          .iol-figure figcaption{padding:10px 14px;color:#52647d;font-size:.92rem}
          .iol-lightbox{width:min(96vw,1100px);max-width:none;padding:0;border:0;background:transparent;overflow:visible}
          .iol-lightbox::backdrop{background:rgba(6,24,47,.84);backdrop-filter:blur(4px)}
          .iol-lightbox__frame{position:relative;padding:12px;border-radius:18px;background:#fff;box-shadow:0 24px 80px rgba(0,0,0,.35)}
          .iol-lightbox__image{display:block;width:100%;max-height:88vh;object-fit:contain;border-radius:12px}
          .iol-lightbox__close{position:absolute;top:-16px;right:-16px;display:grid;width:44px;height:44px;place-items:center;border:2px solid #fff;border-radius:50%;background:#06182f;color:#fff;font-size:27px;line-height:1;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.28)}
          .iol-image-button:focus-visible,.iol-lightbox__close:focus-visible{outline:3px solid #5b9cff;outline-offset:3px}
          .theme-dark .iol-figure,.theme-dark .iol-lightbox__frame{background:#0d213b}
          .theme-dark .iol-figure figcaption{color:#bfd0e8}
          @media(max-width:680px){.iol-figure{border-radius:14px}.iol-zoom-hint{right:10px;bottom:10px;width:40px;height:40px}.iol-lightbox{width:96vw}.iol-lightbox__frame{padding:7px;border-radius:12px}.iol-lightbox__close{top:-12px;right:-6px;width:40px;height:40px}}
          '''
          if 'IOL IMAGE LIGHTBOX 2026-08-06' not in css:
              css = css.rstrip() + '\n' + css_block.strip() + '\n'

          js_block = r'''
          // IOL IMAGE LIGHTBOX 2026-08-06
          (() => {
            const modal = document.querySelector('[data-iol-lightbox-modal]');
            const modalImage = modal?.querySelector('.iol-lightbox__image');
            const closeButton = modal?.querySelector('[data-iol-lightbox-close]');
            let opener = null;
            if (!modal || !modalImage || typeof modal.showModal !== 'function') return;
            document.querySelectorAll('[data-iol-lightbox]').forEach((button) => {
              button.addEventListener('click', () => {
                const source = button.getAttribute('data-iol-lightbox');
                const preview = button.querySelector('img');
                if (!source) return;
                opener = button;
                modalImage.src = source;
                modalImage.alt = preview?.alt || 'Увеличенное медицинское изображение';
                modal.showModal();
                closeButton?.focus();
              });
            });
            const closeModal = () => { if (modal.open) modal.close(); };
            closeButton?.addEventListener('click', closeModal);
            modal.addEventListener('click', (event) => { if (event.target === modal) closeModal(); });
            modal.addEventListener('close', () => {
              modalImage.removeAttribute('src');
              opener?.focus();
              opener = null;
            });
          })();
          '''
          if 'IOL IMAGE LIGHTBOX 2026-08-06' not in js:
              js = js.rstrip() + '\n' + js_block.strip() + '\n'

          required = [
              'iol-normal-vs-dislocation-capsular-bag.avif',
              'iol-displacement-degrees.avif',
              'data-iol-lightbox-modal',
          ]
          for marker in required:
              if marker not in html:
                  raise RuntimeError(f'Отсутствует обязательный маркер: {marker}')

          html_path.write_text(html, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')
          PY

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/iol-image-payload
          rm -f .github/workflows/apply-iol-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add IOL illustrations with click-to-enlarge'
          git push
