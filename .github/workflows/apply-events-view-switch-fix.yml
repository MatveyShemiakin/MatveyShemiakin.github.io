name: Apply events view switch fix

on:
  push:
    branches:
      - fix/events-view-switch
    paths:
      - 'scripts/apply-events-view-switch-fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/events-view-switch
      - name: Patch view switching
        run: python scripts/apply-events-view-switch-fix.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/events/events.js for-doctors/events/index.html en/for-doctors/events/index.html
          git commit -m 'fix: reveal selected events view' || exit 0
          git push origin HEAD:fix/events-view-switch
