name: Integrate shared mobile navbar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-mobile-navbar.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate component across public pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re
          import xml.etree.ElementTree as ET

          root = Path('.')
          css_tag = '<link rel="stylesheet" href="/mobile-nav.css?v=20260806-1">'
          js_tag = '<script src="/mobile-nav.js?v=20260806-1"></script>'

          js_path = root / 'mobile-nav.js'
          js = js_path.read_text(encoding='utf-8')
          old = "const path=(window.location.pathname.replace(/\\/{2,}/g,'/').replace(/\\/+$/,'')||'/')+'/';"
          new = "const cleanPath=window.location.pathname.replace(/\\/{2,}/g,'/').replace(/\\/+$/,'');\n  const path=cleanPath?cleanPath+'/':'/';"
          assert old in js, 'Expected root path normalisation line was not found'
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')

          sitemap = ET.parse(root / 'sitemap.xml')
          namespace = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          public_pages = []
          for loc in sitemap.findall('.//sm:loc', namespace):
              url_path = urlparse(loc.text.strip()).path
              if url_path == '/':
                  page = root / 'index.html'
              elif url_path.endswith('/'):
                  page = root / url_path.lstrip('/') / 'index.html'
              else:
                  page = root / url_path.lstrip('/')
              assert page.exists(), f'Public page from sitemap does not exist: {page}'
              public_pages.append(page)

          for page in public_pages:
              html = page.read_text(encoding='utf-8')
              html = re.sub(r'<link\s+rel="stylesheet"\s+href="/mobile-nav\.css(?:\?v=[^"]*)?">', css_tag, html)
              html = re.sub(r'<script\s+src="/mobile-nav\.js(?:\?v=[^"]*)?"></script>', js_tag, html)
              if '/mobile-nav.css' not in html:
                  assert '</head>' in html, f'Missing </head> in {page}'
                  html = html.replace('</head>', css_tag + '</head>', 1)
              if '/mobile-nav.js' not in html:
                  assert '</body>' in html, f'Missing </body> in {page}'
                  html = html.replace('</body>', js_tag + '</body>', 1)
              page.write_text(html, encoding='utf-8')

          injector_path = root / 'scripts' / 'inject_legal.py'
          injector = injector_path.read_text(encoding='utf-8')
          if 'MOBILE_NAV_STYLE' not in injector:
              anchor = "DOCTORS_SCRIPT = '<script src=\"/doctors-legal.js?v=20260726-8\"></script>'\n"
              addition = (
                  "MOBILE_NAV_STYLE = '<link rel=\"stylesheet\" href=\"/mobile-nav.css?v=20260806-1\">'\n"
                  "MOBILE_NAV_SCRIPT = '<script src=\"/mobile-nav.js?v=20260806-1\"></script>'\n"
                  "MOBILE_NAV_EXCLUDED = {ROOT / 'konspekt.html'}\n"
              )
              assert anchor in injector, 'Injector constants anchor not found'
              injector = injector.replace(anchor, anchor + addition, 1)

              loop_anchor = "    original = text\n\n"
              block = """    if path not in MOBILE_NAV_EXCLUDED:
              if '/mobile-nav.css' in text:
                  text = re.sub(r'<link\\s+rel=\"stylesheet\"\\s+href=\"/mobile-nav\\.css(?:\\?v=[^\"]*)?\">', MOBILE_NAV_STYLE, text)
              elif '</head>' in text:
                  text = text.replace('</head>', MOBILE_NAV_STYLE + '</head>', 1)

              if '/mobile-nav.js' in text:
                  text = re.sub(r'<script\\s+src=\"/mobile-nav\\.js(?:\\?v=[^\"]*)?\"></script>', MOBILE_NAV_SCRIPT, text)
              elif '</body>' in text:
                  text = text.replace('</body>', MOBILE_NAV_SCRIPT + '</body>', 1)
              elif '</html>' in text:
                  text = text.replace('</html>', MOBILE_NAV_SCRIPT + '</html>', 1)

          """
              assert loop_anchor in injector, 'Injector loop anchor not found'
              injector = injector.replace(loop_anchor, loop_anchor + block, 1)
              injector_path.write_text(injector, encoding='utf-8')

          workflow_path = root / '.github' / 'workflows' / 'inject-legal.yml'
          workflow = workflow_path.read_text(encoding='utf-8')
          if "      - 'mobile-nav.js'" not in workflow:
              anchor = "      - 'legal.css'\n"
              addition = "      - 'mobile-nav.js'\n      - 'mobile-nav.css'\n"
              assert anchor in workflow, 'Persistent workflow paths anchor not found'
              workflow_path.write_text(workflow.replace(anchor, anchor + addition, 1), encoding='utf-8')

          test = r'''import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const css=fs.readFileSync('mobile-nav.css','utf8');
          const js=fs.readFileSync('mobile-nav.js','utf8');
          const sitemap=fs.readFileSync('sitemap.xml','utf8');
          const urls=[...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match=>new URL(match[1]));
          const pagePath=url=>url.pathname==='/'?'index.html':url.pathname.endsWith('/')?url.pathname.slice(1)+'index.html':url.pathname.slice(1);

          assert.match(css,/@media\(max-width:760px\)/);
          assert.match(css,/\.site-mobile-nav\{[^}]*position:fixed/);
          assert.match(css,/\.site-mobile-nav__icon\{width:29px;height:29px/);
          assert.match(css,/\.patient-fab\{bottom:calc\(var\(--fab-bottom-offset,20px\) \+ 96px/);
          assert.match(css,/\.cookie-banner\{bottom:calc\(104px/);
          assert.match(js,/const path=cleanPath\?cleanPath\+'\/'\:'\/'/);
          assert.match(js,/patients:'\/patients\/'/);
          assert.match(js,/doctors:'\/for-doctors\/'/);
          assert.match(js,/about:'\/#about'/);
          assert.match(js,/patients:'\/en\/patients\/'/);
          assert.match(js,/doctors:'\/en\/for-doctors\/'/);
          assert.match(js,/MutationObserver\(syncTheme\)/);
          assert.match(js,/site-mobile-search/);
          assert.doesNotMatch(js,/style=/);

          for(const url of urls){
            const file=pagePath(url);
            assert.ok(fs.existsSync(file),`Missing sitemap page ${file}`);
            const html=fs.readFileSync(file,'utf8');
            assert.equal((html.match(/\/mobile-nav\.css\?v=20260806-1/g)||[]).length,1,`CSS tag mismatch in ${file}`);
            assert.equal((html.match(/\/mobile-nav\.js\?v=20260806-1/g)||[]).length,1,`JS tag mismatch in ${file}`);
          }
          const technical=fs.readFileSync('konspekt.html','utf8');
          assert.doesNotMatch(technical,/\/mobile-nav\.(?:css|js)/);
          const injector=fs.readFileSync('scripts/inject_legal.py','utf8');
          assert.match(injector,/MOBILE_NAV_STYLE/);
          assert.match(injector,/MOBILE_NAV_EXCLUDED/);
          console.log(`Mobile navbar verified on ${urls.length} public pages.`);
          ''';
          Path('tests/mobile-navbar.test.mjs').write_text(test.replace('          ', ''), encoding='utf-8')
          PY

      - name: Verify JavaScript and integration
        run: |
          node --check mobile-nav.js
          node tests/mobile-navbar.test.mjs
          python3 -m py_compile scripts/inject_legal.py
          git diff --check

      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-mobile-navbar.yml
          git add mobile-nav.js scripts/inject_legal.py .github/workflows/inject-legal.yml tests/mobile-navbar.test.mjs
          git add '*.html' '**/*.html'
          git diff --cached --check
          git commit -m 'Integrate bilingual mobile navbar across site'
          git push origin main
