name: Global site motion TDD

on:
  push:
    branches:
      - feature/global-site-motion
    paths:
      - 'tests/*.test.mjs'
      - 'site-motion.css'
      - 'site-motion.js'
      - 'scripts/inject_site_theme.py'
      - '**/*.html'
      - '.github/workflows/global-site-motion-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public pages
        run: python scripts/inject_site_theme.py
      - name: Verify focused motion contract
        run: node tests/site-motion.test.mjs
      - name: Verify mobile navigation
        run: node tests/mobile-navbar.test.mjs
      - name: PKP image caption treatment
        continue-on-error: true
        run: node --test --test-name-pattern="hides the embedded" tests/penetrating-keratoplasty-page.test.mjs
      - name: PKP watermark treatment
        continue-on-error: true
        run: node --test --test-name-pattern="protects every" tests/penetrating-keratoplasty-page.test.mjs
      - name: PKP reading measure
        continue-on-error: true
        run: node --test --test-name-pattern="keeps the ergonomic" tests/penetrating-keratoplasty-page.test.mjs
      - name: PKP shared clinical header
        continue-on-error: true
        run: node --test --test-name-pattern="shared clinical header" tests/penetrating-keratoplasty-page.test.mjs
      - name: PKP professional notice placement
        continue-on-error: true
        run: node --test --test-name-pattern="professional notice is injected" tests/penetrating-keratoplasty-page.test.mjs
      - name: PKP notice contrast
        continue-on-error: true
        run: node --test --test-name-pattern="professional notice title" tests/penetrating-keratoplasty-page.test.mjs
      - name: PKP treatment cards
        continue-on-error: true
        run: node --test --test-name-pattern="treatment cards" tests/penetrating-keratoplasty-page.test.mjs
      - name: PKP library preview
        continue-on-error: true
        run: node --test --test-name-pattern="keratoplasty library preview" tests/penetrating-keratoplasty-page.test.mjs
      - name: Verify breadcrumbs
        if: always()
        run: node tests/site-breadcrumbs.test.mjs
      - name: Verify global theme compatibility
        if: always()
        run: node tests/site-theme.test.mjs
