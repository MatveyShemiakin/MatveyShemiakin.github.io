name: Global site motion TDD

on:
  push:
    branches:
      - feature/global-site-motion
    paths:
      - 'tests/*.test.mjs'
      - 'site-motion.css'
      - 'site-motion.js'
      - 'scripts/inject_site_theme.py'
      - 'scripts/inject_legal.py'
      - 'docs/releases/**'
      - '**/*.html'
      - '.github/workflows/global-site-motion-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate public pages
        run: python scripts/inject_site_theme.py

      - name: Capture first generation
        run: |
          mkdir -p /tmp/first-tree
          git diff --name-only -z | while IFS= read -r -d '' file; do
            mkdir -p "/tmp/first-tree/$(dirname "$file")"
            cp "$file" "/tmp/first-tree/$file"
          done

      - name: Verify generator idempotence
        shell: bash
        run: |
          python scripts/inject_site_theme.py
          status=0
          while IFS= read -r -d '' file; do
            if ! cmp -s "/tmp/first-tree/$file" "$file"; then
              echo "::error file=$file::Generator changed $file on its second run"
              diff -u "/tmp/first-tree/$file" "$file" | head -n 80 || true
              status=1
            fi
          done < <(find /tmp/first-tree -type f -printf '%P\0')
          exit "$status"

      - name: Verify global motion
        run: node --test tests/site-motion.test.mjs

      - name: Verify mobile navigation
        run: node --test tests/mobile-navbar.test.mjs

      - name: Verify penetrating keratoplasty pages
        run: node --test tests/penetrating-keratoplasty-page.test.mjs

      - name: Verify breadcrumbs
        run: node --test tests/site-breadcrumbs.test.mjs

      - name: Verify global theme compatibility
        run: node --test tests/site-theme.test.mjs

      - name: Commit generated pages
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' patients/iol-dislocation/script.js site-theme.css || true
          git commit -m "Inject global motion across public pages"
          git push
