name: IOL header photo clean verification

on:
  push:
    branches:
      - feature/iol-header-clinical-photo-clean
    paths:
      - 'assets/iol-dislocation-header.webp'
      - 'patients/iol-dislocation/header-photo.css'
      - 'patients/iol-dislocation/index.html'
      - 'en/patients/iol-dislocation/index.html'
      - 'tests/iol-header-photo.test.mjs'
      - '.github/workflows/iol-header-photo-clean-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link photo stylesheet without changing header markup
        run: |
          python - <<'PY'
          from pathlib import Path

          link = '<link rel="stylesheet" href="/patients/iol-dislocation/header-photo.css?v=20260806-1">'
          marker = '<script src="/site-theme-init.js?v=20260806-1"></script>'
          paths = (
              Path('patients/iol-dislocation/index.html'),
              Path('en/patients/iol-dislocation/index.html'),
          )

          for path in paths:
              text = path.read_text(encoding='utf-8')
              if link not in text:
                  if marker not in text:
                      raise SystemExit(f'{path}: site theme marker not found')
                  text = text.replace(marker, link + marker, 1)
              if text.count(link) != 1:
                  raise SystemExit(f'{path}: expected exactly one header-photo stylesheet link')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regression suite
        run: |
          node --test tests/iol-header-photo.test.mjs
          node --test tests/iol-next-section-scroll.test.mjs
          node --test tests/mobile-navbar.test.mjs

      - name: Commit page links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patients/iol-dislocation/index.html en/patients/iol-dislocation/index.html
          git commit -m "Link IOL header clinical photo styles"
          git push
