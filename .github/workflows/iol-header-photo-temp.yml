name: IOL header clinical photo TDD

on:
  push:
    branches:
      - feature/iol-header-clinical-photo
    paths:
      - '.tmp/iol-header-photo.part*'
      - 'assets/iol-dislocation-header.webp'
      - 'patients/iol-dislocation/header-photo.css'
      - 'patients/iol-dislocation/index.html'
      - 'en/patients/iol-dislocation/index.html'
      - 'tests/iol-header-photo.test.mjs'
      - '.github/workflows/iol-header-photo-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble approved clinical photograph
        run: |
          cat .tmp/iol-header-photo.part00 \
              .tmp/iol-header-photo.part01 \
              .tmp/iol-header-photo.part02 \
              .tmp/iol-header-photo.part03 \
              .tmp/iol-header-photo.part04 \
              .tmp/iol-header-photo.part05 \
              .tmp/iol-header-photo.part06 \
            | base64 --decode > assets/iol-dislocation-header.webp
          echo '206a48ac12500a267206dbd57a235d58c949ef23da5836d4f4c0f087fc858557  assets/iol-dislocation-header.webp' | sha256sum --check

      - name: Add isolated header background styles
        run: |
          cat > patients/iol-dislocation/header-photo.css <<'CSS'
          .sim-page .site-head {
            position: relative;
            isolation: isolate;
            overflow: hidden;
          }

          .sim-page .site-head::before {
            content: "";
            position: absolute;
            z-index: 0;
            top: 84px;
            right: 0;
            bottom: 0;
            width: min(62vw, 900px);
            background: url("/assets/iol-dislocation-header.webp?v=20260806-1") 58% 46% / cover no-repeat;
            opacity: .82;
            pointer-events: none;
          }

          .sim-page .site-head::after {
            content: "";
            position: absolute;
            z-index: 0;
            inset: 0;
            background:
              linear-gradient(90deg, rgba(6, 24, 47, 1) 0%, rgba(6, 24, 47, .98) 42%, rgba(6, 24, 47, .76) 64%, rgba(4, 18, 37, .28) 100%),
              linear-gradient(180deg, rgba(4, 18, 37, .12), rgba(4, 18, 37, .55));
            pointer-events: none;
          }

          .sim-page .site-head > .container {
            position: relative;
            z-index: 1;
          }

          @media (max-width: 1020px) {
            .sim-page .site-head::before {
              top: 72px;
              width: 68vw;
              opacity: .68;
              background-position: 58% 44%;
            }

            .sim-page .site-head::after {
              background:
                linear-gradient(90deg, rgba(6, 24, 47, 1) 0%, rgba(6, 24, 47, .97) 52%, rgba(4, 18, 37, .52) 100%),
                linear-gradient(180deg, rgba(4, 18, 37, .16), rgba(4, 18, 37, .62));
            }
          }

          @media (max-width: 680px) {
            .sim-page .site-head::before {
              top: 72px;
              right: -18%;
              bottom: 0;
              width: 112%;
              opacity: .56;
              background-position: 59% 46%;
            }

            .sim-page .site-head::after {
              background:
                linear-gradient(180deg, rgba(4, 18, 37, .98) 0%, rgba(4, 18, 37, .93) 49%, rgba(4, 18, 37, .56) 73%, rgba(4, 18, 37, .88) 100%),
                linear-gradient(90deg, rgba(6, 24, 47, .97), rgba(4, 18, 37, .38));
            }
          }
          CSS

      - name: Link styles without changing header markup
        run: |
          python - <<'PY'
          from pathlib import Path

          link = '<link rel="stylesheet" href="/patients/iol-dislocation/header-photo.css?v=20260806-1">'
          paths = (
              Path('patients/iol-dislocation/index.html'),
              Path('en/patients/iol-dislocation/index.html'),
          )

          for path in paths:
              text = path.read_text(encoding='utf-8')
              if link not in text:
                  text = text.replace('</head>', link + '</head>', 1)
              if text.count(link) != 1:
                  raise SystemExit(f'{path}: expected exactly one header-photo stylesheet link')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regression suite
        run: |
          node --test tests/iol-header-photo.test.mjs
          node --test tests/iol-next-section-scroll.test.mjs
          node --test tests/mobile-navbar.test.mjs
          node --test tests/site-theme.test.mjs
          node --test tests/site-motion.test.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .tmp
          git add assets/iol-dislocation-header.webp \
                  patients/iol-dislocation/header-photo.css \
                  patients/iol-dislocation/index.html \
                  en/patients/iol-dislocation/index.html
          git commit -m "Add clinical photo to IOL page header"
          git push
