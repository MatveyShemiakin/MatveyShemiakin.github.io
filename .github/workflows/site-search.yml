name: Website full-text search

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generator and query behavior
        run: |
          python -m unittest discover -s tests -p test_site_search.py
          python scripts/build_site_search.py --write
          python scripts/build_site_search.py --check
          node --check mobile-nav.js
          node --check assets/events/events.js
          node tests/site-search.test.cjs
          node tests/mobile-navbar.test.mjs
          node tests/patient-global-search.test.mjs
          node --test tests/complicated-cataract-series.test.mjs
      - name: Require a current index in search pull requests
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/site-search')
        run: git diff --exit-code

  refresh:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh static index and search hooks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_site_search.py --write
          git add -- '*.html' site-search-index.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh website full-text search index'
          git push origin HEAD:main
          # GITHUB_TOKEN commits do not trigger a Pages build themselves.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
