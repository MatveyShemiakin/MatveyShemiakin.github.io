name: Apply global ophthalmology events expansion

on:
  push:
    branches:
      - feature/global-ophthalmology-events-expansion
    paths:
      - 'scripts/apply-global-events-expansion.py'
      - '.github/workflows/apply-global-events-expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-ophthalmology-events-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified global event catalogue
        run: python scripts/apply-global-events-expansion.py
      - name: Validate datasets and page wiring
        run: |
          python scripts/sync-ophthalmology-events.py --validate-only
          python - <<'PY'
          import json
          from pathlib import Path
          ru=json.loads(Path('assets/data/ophthalmology-events.ru.json').read_text(encoding='utf-8'))
          en=json.loads(Path('assets/data/ophthalmology-events.en.json').read_text(encoding='utf-8'))
          assert len(ru['events']) >= 45, len(ru['events'])
          assert {e['id'] for e in ru['events']} == {e['id'] for e in en['events']}
          required={'ccos-2026','asmhk-2026','apspos-capos-2027','mioc-2026','ossa-2027','paao-2027','dog-2026','aapos-2027','aao-2026'}
          assert required <= {e['id'] for e in ru['events']}
          regions={e['region'] for e in ru['events']}
          for r in ['Китай / Greater China','Ближний Восток','Африка','Латинская Америка']:
              assert r in regions, (r,regions)
          rhtml=Path('for-doctors/events/index.html').read_text(encoding='utf-8')
          ehtml=Path('en/for-doctors/events/index.html').read_text(encoding='utf-8')
          for term in ['Китай / Greater China','Ближний Восток','Африка','Латинская Америка','Детская офтальмология','Нейроофтальмология']:
              assert term in rhtml, term
          for term in ['China / Greater China','Middle East','Africa','Latin America','Pediatric ophthalmology','Neuro-ophthalmology']:
              assert term in ehtml, term
          assert 'hero-note' not in rhtml and 'hero-note' not in ehtml
          print('global catalogue verification: OK',len(ru['events']))
          PY
      - name: Commit generated catalogue
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/data/ophthalmology-events.ru.json assets/data/ophthalmology-events.en.json assets/data/ophthalmology-event-sources.json for-doctors/events/index.html en/for-doctors/events/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Expand ophthalmology events catalogue worldwide'
          git push origin HEAD:feature/global-ophthalmology-events-expansion
