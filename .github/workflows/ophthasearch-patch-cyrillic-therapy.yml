name: OphthaSearch patch Cyrillic therapy regex

on:
  push:
    paths:
      - '.github/workflows/ophthasearch-patch-cyrillic-therapy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ophthasearch-dataset-foundation-20260829
      - name: Apply exact regex patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('workers/ophthasearch-v2/query-interpreter.js')
          text = path.read_text()
          old = r'\bтерапи[а-я]*\b'
          new = r'терапи[а-я]*'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 Cyrillic therapy boundary patterns, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- workers/ophthasearch-v2/query-interpreter.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/ophthasearch-v2/query-interpreter.js
          git commit -m 'fix: recognize Cyrillic therapy wording'
          git push origin HEAD:feature/ophthasearch-dataset-foundation-20260829
