name: Fix events header and navigation

on:
  push:
    branches:
      - fix/events-header-nav

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved header and navigation fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch_page(path, lang):
              p=Path(path)
              text=p.read_text(encoding='utf-8')

              # Remove the explanatory data/source note requested by the site owner.
              text=re.sub(r'\s*<aside class="data-note">.*?</aside>', '', text, count=1, flags=re.S)

              # Use the current site header structure so the shared mega navigation can mount.
              if lang=='ru':
                  header='''<header class="site-header">\n  <div class="container nav">\n    <a class="monogram" href="/" aria-label="На главную">МШ</a>\n    <div class="nav-right">\n      <nav aria-label="Основная навигация">\n        <a href="/patients/">Пациентам</a>\n        <a href="/for-doctors/">Для врачей</a>\n        <a href="/#about">О враче</a>\n        <a href="/#directions">Направления</a>\n        <a href="/#education">Образование</a>\n        <a href="/#science">Наука</a>\n        <a href="/#contacts">Контакты</a>\n      </nav>\n      <a class="mobile-patients-link" href="/patients/">Пациентам</a>\n      <a class="mobile-patients-link" href="/for-doctors/">Врачам</a>\n      <div class="language-switch" aria-label="Язык страницы" role="group">\n        <a class="language-button active" href="/for-doctors/events/" lang="ru" hreflang="ru" aria-current="page">RU</a>\n        <a class="language-button" href="/en/for-doctors/events/" lang="en" hreflang="en">EN</a>\n      </div>\n      <button class="site-theme-toggle" id="theme-toggle" type="button" aria-label="Переключить цветовую гамму" title="Тема">☾</button>\n    </div>\n  </div>\n</header>'''
                  text=text.replace('Демо-данные проверены 16 августа 2026 года.','Данные проверены 16 августа 2026 года.')
              else:
                  header='''<header class="site-header">\n  <div class="container nav">\n    <a class="monogram" href="/en/" aria-label="Home">MS</a>\n    <div class="nav-right">\n      <nav aria-label="Primary navigation">\n        <a href="/en/patients/">Patients</a>\n        <a href="/en/for-doctors/">For doctors</a>\n        <a href="/en/#about">About</a>\n        <a href="/en/#directions">Specialties</a>\n        <a href="/en/#education">Education</a>\n        <a href="/en/#science">Research</a>\n        <a href="/en/#contacts">Contacts</a>\n      </nav>\n      <a class="mobile-patients-link" href="/en/patients/">Patients</a>\n      <a class="mobile-patients-link" href="/en/for-doctors/">Doctors</a>\n      <div class="language-switch" aria-label="Page language" role="group">\n        <a class="language-button" href="/for-doctors/events/" lang="ru" hreflang="ru">RU</a>\n        <a class="language-button active" href="/en/for-doctors/events/" lang="en" hreflang="en" aria-current="page">EN</a>\n      </div>\n      <button class="site-theme-toggle" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Theme">☾</button>\n    </div>\n  </div>\n</header>'''
              text=re.sub(r'<header class="site-header">.*?</header>',header,text,count=1,flags=re.S)

              # Shared current header assets. Keep the page-specific theme runtime to avoid a duplicate theme controller.
              assets='''<link rel="stylesheet" href="/site-language-switch.css?v=20260729-2">\n<script src="/site-theme-init.js?v=20260806-1"></script>\n<link rel="stylesheet" href="/site-theme.css?v=20260806-1">'''
              if '/site-theme.css?v=20260806-1' not in text:
                  text=text.replace('<link rel="stylesheet" href="/assets/events/events.css">','<link rel="stylesheet" href="/assets/events/events.css">\n'+assets,1)

              text=re.sub(r'/site-mega-nav\.css\?v=[^"\']+', '/site-mega-nav.css?v=20260816-2', text)
              text=re.sub(r'/site-mega-nav\.js\?v=[^"\']+', '/site-mega-nav.js?v=20260816-2', text)

              assert 'data-note' not in text
              assert 'class="container nav"' in text
              assert 'id="theme-toggle"' in text
              assert 'style=' not in text
              p.write_text(text,encoding='utf-8')

          patch_page('for-doctors/events/index.html','ru')
          patch_page('en/for-doctors/events/index.html','en')

          # Remove the old compact standalone header styling and inherit the current site header geometry.
          css_path=Path('assets/events/events-core.css')
          lines=css_path.read_text(encoding='utf-8').splitlines()
          remove_prefixes=('.site-header{','.header-inner{','.brand{','.header-actions{')
          out=[]
          inserted=False
          for line in lines:
              if line.startswith(remove_prefixes):
                  if not inserted:
                      out.extend([
                          '.site-header{position:relative;inset:auto;z-index:120;height:auto;background:#041225;color:#fff}',
                          '.site-header .nav{height:98px;border-bottom:1px solid rgba(255,255,255,.72)}',
                          '.site-header .nav-right{gap:30px}',
                          '.site-header .site-theme-toggle{flex:0 0 auto}',
                      ])
                      inserted=True
                  continue
              out.append(line)
          css_path.write_text('\n'.join(out)+'\n',encoding='utf-8')

          # Add the calendar to the shared For doctors mega menu in both languages.
          nav_path=Path('site-mega-nav.js')
          nav=nav_path.read_text(encoding='utf-8')
          en_old="""        {title:'Clinical materials',items:[\n          {label:'Bacterial keratitis and corneal ulcer',href:'/en/for-doctors/bacterial-keratitis/'},\n          {label:'Follow-up after penetrating keratoplasty',href:'/en/for-doctors/penetrating-keratoplasty/'}\n        ]}\n"""
          en_new=en_old+"""        ,{title:'Tools',items:[\n          {label:'Ophthalmology events',href:'/en/for-doctors/events/'}\n        ]}\n"""
          ru_old="""        {title:'Клинические материалы',items:[\n          {label:'Бактериальный кератит и язва роговицы',href:'/for-doctors/bacterial-keratitis/'},\n          {label:'Ведение после сквозной кератопластики',href:'/for-doctors/penetrating-keratoplasty/'}\n        ]}\n"""
          ru_new=ru_old+"""        ,{title:'Инструменты',items:[\n          {label:'Офтальмологические события',href:'/for-doctors/events/'}\n        ]}\n"""
          if 'Ophthalmology events' not in nav:
              assert en_old in nav
              nav=nav.replace(en_old,en_new,1)
          if 'Офтальмологические события' not in nav:
              assert ru_old in nav
              nav=nav.replace(ru_old,ru_new,1)
          nav_path.write_text(nav,encoding='utf-8')

          # Bust the shared mega-nav cache on the next main-branch injection.
          inject_path=Path('scripts/inject_site_mega_nav.py')
          inject=inject_path.read_text(encoding='utf-8').replace('20260816-1','20260816-2')
          inject_path.write_text(inject,encoding='utf-8')

          # Strengthen the existing navigation regression test.
          test_path=Path('tests/site-mega-nav.test.mjs')
          test=test_path.read_text(encoding='utf-8')
          test=test.replace("'Бактериальный кератит и язва роговицы','Ведение после сквозной кератопластики',", "'Бактериальный кератит и язва роговицы','Ведение после сквозной кератопластики','Офтальмологические события',")
          test=test.replace("'Patients','For doctors','About the doctor','Cataract','Glaucoma','Intraocular lens dislocation'", "'Patients','For doctors','About the doctor','Cataract','Glaucoma','Intraocular lens dislocation','Ophthalmology events'")
          test=test.replace("'/for-doctors/','/for-doctors/bacterial-keratitis/','/for-doctors/penetrating-keratoplasty/',", "'/for-doctors/','/for-doctors/bacterial-keratitis/','/for-doctors/penetrating-keratoplasty/','/for-doctors/events/','/en/for-doctors/events/',")
          test_path.write_text(test,encoding='utf-8')

          # Local structural verification before committing.
          assert 'Офтальмологические события' in nav
          assert 'Ophthalmology events' in nav
          assert '/for-doctors/events/' in nav and '/en/for-doctors/events/' in nav
          print('events header/navigation patch: OK')
          PY
      - name: Verify syntax and navigation contract
        run: |
          node --check site-mega-nav.js
          node --test tests/site-mega-nav.test.mjs
          python - <<'PY'
          from pathlib import Path
          for p in ('for-doctors/events/index.html','en/for-doctors/events/index.html'):
              t=Path(p).read_text(encoding='utf-8')
              assert 'data-note' not in t
              assert 'site-mega-nav.css?v=20260816-2' in t
              assert 'site-mega-nav.js?v=20260816-2' in t
              assert 'class="container nav"' in t
          print('event pages: OK')
          PY
      - name: Remove temporary workflow and commit fixes
        run: |
          rm .github/workflows/fix-events-header-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix events header and clinician navigation"
          git push
