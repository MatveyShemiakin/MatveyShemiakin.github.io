name: OphthaSearch canary

on:
  push:
    branches:
      - fix/ophthasearch-single-architecture-20260825
    paths:
      - '_worker.js'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'workers/ophthasearch-v2/**'
      - 'for-doctors/ophthasearch-v2/**'
      - 'tests/ophthasearch-v2-*.test.mjs'
      - 'tests/ophthasearch-production-v2.test.mjs'
      - 'scripts/ophthasearch-live-smoke.mjs'
      - '.github/workflows/ophthasearch-canary.yml'
  pull_request:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'workers/ophthasearch-v2/**'
      - 'for-doctors/ophthasearch-v2/**'
      - 'tests/ophthasearch-v2-*.test.mjs'
      - 'tests/ophthasearch-production-v2.test.mjs'
      - 'scripts/ophthasearch-live-smoke.mjs'
      - '.github/workflows/ophthasearch-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ophthasearch-canary-shared
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  OPHTHASEARCH_ENDPOINT: https://matveyshemiakin-ophthasearch-canary.matvei-shemyakin.workers.dev/v2/research

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run v2 acceptance tests before deployment
        run: >-
          node --test
          tests/ophthasearch-v2-contracts.test.mjs
          tests/ophthasearch-v2-relevance.test.mjs
          tests/ophthasearch-v2-query.test.mjs
          tests/ophthasearch-v2-mixed-comparison.test.mjs
          tests/ophthasearch-v2-retrieval-regressions.test.mjs
          tests/ophthasearch-v2-evidence.test.mjs
          tests/ophthasearch-v2-adapters.test.mjs
          tests/ophthasearch-v2-guidelines.test.mjs
          tests/ophthasearch-v2-reasoner.test.mjs
          tests/ophthasearch-v2-latency.test.mjs
          tests/ophthasearch-v2-pipeline.test.mjs
          tests/ophthasearch-v2-ui.test.mjs
          tests/ophthasearch-production-v2.test.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Cloudflare deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Deploy isolated canary Worker
        run: npx wrangler deploy --config wrangler.jsonc --name matveyshemiakin-ophthasearch-canary

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: glaucoma-core
            case_ids: poag-latanoprost-vs-timolol,poag-travoprost-vs-bimatoprost,poag-brimonidine-vs-dorzolamide,poag-slt-vs-latanoprost,poag-first-line-pharmacotherapy
          - shard: glaucoma-retina
            case_ids: poag-ocular-surface-modifier,normal-tension-glaucoma-management,angle-closure-medical-therapy,rrd-surgical-management,rrd-ppv-vs-scleral-buckle
          - shard: retina-vitreoretina
            case_ids: rrd-pneumatic-vs-buckle,erm-surgery-vis08-metamorphopsia,erm-surgery-vis05,macular-hole-450-phakic,large-macular-hole-ilm-comparison
          - shard: lens-cornea-uveitis
            case_ids: iol-dislocation-vitreous-glaucoma,iol-dislocation-vitrectomy,cataract-surgical-management,keratitis-antibacterial-therapy,uveitis-medical-therapy
    env:
      OPHTHASEARCH_CASE_IDS: ${{ matrix.case_ids }}
      OPHTHASEARCH_SMOKE_ATTEMPTS: '2'
      OPHTHASEARCH_SMOKE_RETRY_MS: '5000'
      OPHTHASEARCH_MAX_CASE_MS: '35000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run five-case live clinical acceptance shard
        run: node scripts/ophthasearch-live-smoke.mjs
