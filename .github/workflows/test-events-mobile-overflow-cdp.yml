name: Test events mobile overflow via CDP

on:
  push:
    branches:
      - fix/events-mobile-overflow
    paths:
      - 'scripts/test-events-mobile-overflow-cdp.mjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/events-mobile-overflow
      - name: Run CDP overflow assertions
        run: |
          mkdir -p cdp-mobile
          python3 -m http.server 8000 >/tmp/events-http.log 2>&1 &
          SERVER_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/events-cdp about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $SERVER_PID $CHROME_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break; sleep 1; done
          node scripts/test-events-mobile-overflow-cdp.mjs
      - name: Upload verified screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-mobile-cdp-screenshots
          path: cdp-mobile/*.png
          if-no-files-found: warn
