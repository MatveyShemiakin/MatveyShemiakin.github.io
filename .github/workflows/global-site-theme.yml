name: Publish global site theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-site-theme.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify regression test fails before integration
        id: red
        continue-on-error: true
        run: node tests/site-theme.test.mjs

      - name: Confirm red phase
        run: |
          if [ "${{ steps.red.outcome }}" != "failure" ]; then
            echo "Theme integration regression test unexpectedly passed before injection."
            exit 1
          fi
          echo "Red phase confirmed."

      - name: Integrate global theme
        run: python3 scripts/inject_site_theme.py

      - name: Verify implementation
        run: |
          node --check site-theme-init.js
          node --check site-theme.js
          node --check mobile-nav.js
          node --check patients/iol-dislocation/script.js
          node tests/site-theme.test.mjs
          python3 -m py_compile scripts/inject_site_theme.py
          grep -q 'BACTERIAL_THEME_CONTRAST_BUNDLE' site-theme.css
          ! grep -q 'MutationObserver' site-theme-init.js
          ! grep -q 'MutationObserver' site-theme.js
          ! grep -q 'backdrop-filter' site-theme.css
          git diff --check

      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add global light and dark themes'
          git push origin main
