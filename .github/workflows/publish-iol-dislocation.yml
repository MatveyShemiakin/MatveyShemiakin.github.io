name: Publish IOL dislocation patient guide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-iol-dislocation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore publication files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/iol-publish/part-*.txt | base64 --decode > /tmp/iol-pages.tar.gz
          echo 'b2c053477b1fd7149d05c3693b798b5ba95d31011de507a6e3812e73ecca2f5d  /tmp/iol-pages.tar.gz' | sha256sum -c -
          tar -xzf /tmp/iol-pages.tar.gz -C .

      - name: Add navigation cards and sitemap entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          ru_path = Path('patients/index.html')
          en_path = Path('en/patients/index.html')

          ru = ru_path.read_text(encoding='utf-8')
          en = en_path.read_text(encoding='utf-8')

          ru_nav_old = '<a href="#paths">Этапы лечения</a><a href="#faq">Вопросы</a>'
          ru_nav_new = '<a href="#paths">Этапы лечения</a><a href="#conditions">Заболевания</a><a href="#faq">Вопросы</a>'
          en_nav_old = '<a href="#paths">Stages</a><a href="#faq">Questions</a>'
          en_nav_new = '<a href="#paths">Stages</a><a href="#conditions">Conditions</a><a href="#faq">Questions</a>'

          if '#conditions' not in ru:
              if ru_nav_old not in ru:
                  raise SystemExit('RU navigation insertion point not found')
              ru = ru.replace(ru_nav_old, ru_nav_new, 1)
          if '#conditions' not in en:
              if en_nav_old not in en:
                  raise SystemExit('EN navigation insertion point not found')
              en = en.replace(en_nav_old, en_nav_new, 1)

          ru_block = '<section class="paths-section" id="conditions"><div class="container"><div class="section-head"><div><p class="section-kicker">Заболевания и состояния</p><h2>Подробные материалы по диагнозам</h2></div><p>Отдельные страницы помогают последовательно разобраться в симптомах, обследовании, лечении и восстановлении при конкретной офтальмологической патологии.</p></div><div class="path-grid"><a class="path-card" href="/patients/iol-dislocation/"><span>ИОЛ</span><h3>Смещение искусственного хрусталика</h3><p>Причины, симптомы, опасные признаки, обследование, хирургическое лечение и восстановление при дислокации ИОЛ.</p><strong>Открыть материал →</strong></a></div></div></section>\n'
          en_block = '<section class="paths-section" id="conditions"><div class="container"><div class="section-head"><div><p class="section-kicker">Conditions and diagnoses</p><h2>Detailed information by diagnosis</h2></div><p>Dedicated pages explain symptoms, examination, treatment and recovery for specific ophthalmic conditions in a clear sequence.</p></div><div class="path-grid"><a class="path-card" href="/en/patients/iol-dislocation/"><span>IOL</span><h3>Intraocular lens dislocation</h3><p>Causes, symptoms, warning signs, examination, surgical treatment and recovery after IOL dislocation.</p><strong>Open the guide →</strong></a></div></div></section>\n'
          marker = '<section class="faq-section" id="faq">'
          if '/patients/iol-dislocation/' not in ru:
              if marker not in ru:
                  raise SystemExit('RU FAQ insertion point not found')
              ru = ru.replace(marker, ru_block + marker, 1)
          if '/en/patients/iol-dislocation/' not in en:
              if marker not in en:
                  raise SystemExit('EN FAQ insertion point not found')
              en = en.replace(marker, en_block + marker, 1)

          ru_path.write_text(ru, encoding='utf-8')
          en_path.write_text(en, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          xml = sitemap.read_text(encoding='utf-8')
          entries = (
              '  <url><loc>https://matveyshemyakin.ru/patients/iol-dislocation/</loc><lastmod>2026-08-05</lastmod></url>\n'
              '  <url><loc>https://matveyshemyakin.ru/en/patients/iol-dislocation/</loc><lastmod>2026-08-05</lastmod></url>\n'
          )
          if 'patients/iol-dislocation/' not in xml:
              xml = xml.replace('</urlset>', entries + '</urlset>')
          xml = xml.replace('<loc>https://matveyshemyakin.ru/patients/</loc><lastmod>2026-07-20</lastmod>', '<loc>https://matveyshemyakin.ru/patients/</loc><lastmod>2026-08-05</lastmod>')
          xml = xml.replace('<loc>https://matveyshemyakin.ru/en/patients/</loc><lastmod>2026-07-20</lastmod>', '<loc>https://matveyshemyakin.ru/en/patients/</loc><lastmod>2026-08-05</lastmod>')
          sitemap.write_text(xml, encoding='utf-8')
          ET.parse(sitemap)

          sitemap_txt = Path('sitemap.txt')
          lines = sitemap_txt.read_text(encoding='utf-8').splitlines()
          for url in ('https://matveyshemyakin.ru/patients/iol-dislocation/', 'https://matveyshemyakin.ru/en/patients/iol-dislocation/'):
              if url not in lines:
                  lines.append(url)
          sitemap_txt.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate publication
        shell: bash
        run: |
          set -euo pipefail
          node --check patients/iol-dislocation/script.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from xml.etree import ElementTree as ET

          class Parser(HTMLParser):
              pass

          for path in (
              Path('patients/iol-dislocation/index.html'),
              Path('en/patients/iol-dislocation/index.html'),
              Path('patients/index.html'),
              Path('en/patients/index.html'),
          ):
              text = path.read_text(encoding='utf-8')
              Parser().feed(text)
              if ' style=' in text.lower():
                  raise SystemExit(f'Inline style found in {path}')

          for path in (Path('patients/iol-dislocation/index.html'), Path('en/patients/iol-dislocation/index.html')):
              text = path.read_text(encoding='utf-8')
              assert text.count('class="faq-item') == 24, path
              assert text.count('data-panel=') == 4, path
              assert '/legal.js?v=20260723-7' in text, path
              assert 'reading-progress' in text, path
              assert 'theme-toggle' in text, path

          ru = Path('patients/index.html').read_text(encoding='utf-8')
          en = Path('en/patients/index.html').read_text(encoding='utf-8')
          assert 'href="/patients/iol-dislocation/"' in ru
          assert 'href="/en/patients/iol-dislocation/"' in en
          assert 'href="#conditions"' in ru and 'href="#conditions"' in en
          ET.parse('sitemap.xml')
          PY

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/iol-publish
          rm -f .github/workflows/publish-iol-dislocation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patients/iol-dislocation en/patients/iol-dislocation patients/index.html en/patients/index.html sitemap.xml sitemap.txt .github
          git diff --cached --check
          git commit -m 'Publish IOL dislocation patient guide'
          git push origin HEAD:main
