name: Diagnose IOL publication payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-iol-dislocation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect payload chunks
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/iol-publish/part-*.txt
          sha256sum .github/iol-publish/part-*.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed=set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\n\r')
          for path in sorted(Path('.github/iol-publish').glob('part-*.txt')):
              text=path.read_text(encoding='utf-8')
              bad=[(i,repr(ch)) for i,ch in enumerate(text) if ch not in allowed]
              print(path, 'length=',len(text), 'bad=',bad[:10])
          PY
