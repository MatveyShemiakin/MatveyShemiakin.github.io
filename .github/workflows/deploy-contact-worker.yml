name: Deploy contact Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/contact-worker/**'
      - '.github/workflows/deploy-contact-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTACT_RECIPIENT: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID"
          test -n "$CONTACT_RECIPIENT"
      - name: Resolve Cloudflare account from site zone
        run: |
          response="$(curl --fail --silent --show-error 'https://api.cloudflare.com/client/v4/zones?name=matveyshemyakin.ru&status=active' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json')"
          printf '%s' "$response" | jq -e '.success == true and (.result | length) == 1' >/dev/null
          account_id="$(printf '%s' "$response" | jq -r '.result[0].account.id')"
          test "${#account_id}" -eq 32
          if [ "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" != "$account_id" ]; then
            echo '::warning::Configured CLOUDFLARE_ACCOUNT_ID does not match the account that owns matveyshemyakin.ru; using the zone account for this deployment.'
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
      - name: Install Wrangler
        working-directory: cloudflare/contact-worker
        run: npm install --no-save wrangler@4
      - name: Deploy contact Worker
        working-directory: cloudflare/contact-worker
        run: npx wrangler deploy --config wrangler.toml
      - name: Set contact recipient secret
        working-directory: cloudflare/contact-worker
        run: printf '%s' "$CONTACT_RECIPIENT" | npx wrangler secret put CONTACT_RECIPIENT --name matveyshemyakin-contact --config wrangler.toml
      - name: Verify Worker route
        run: |
          code="$(curl --silent --show-error --output /tmp/contact-worker-response --write-out '%{http_code}' --request OPTIONS https://matveyshemyakin.ru/api/contact)"
          cat /tmp/contact-worker-response || true
          test "$code" = "204"
      - name: Verify email sending
        run: |
          started_at="$(( $(date +%s%3N) - 5000 ))"
          payload="$(printf '{\"name\":\"Deployment test\",\"organization\":\"matveyshemyakin.ru\",\"reply_email\":\"test@example.com\",\"topic\":\"other\",\"message\":\"Automated Cloudflare Worker deployment verification message.\",\"honeypot\":\"\",\"consent\":true,\"started_at\":%s}' "$started_at")"
          code="$(curl --silent --show-error --output /tmp/contact-send-response --write-out '%{http_code}' --request POST https://matveyshemyakin.ru/api/contact --header 'Origin: https://matveyshemyakin.ru' --header 'Content-Type: application/json' --data "$payload")"
          cat /tmp/contact-send-response || true
          test "$code" = "200"
          grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true' /tmp/contact-send-response
