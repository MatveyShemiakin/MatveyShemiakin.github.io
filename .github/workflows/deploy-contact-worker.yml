name: Deploy contact Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/contact-worker/**'
      - '.github/workflows/deploy-contact-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTACT_RECIPIENT: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CONTACT_RECIPIENT"
      - name: Deploy contact Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/contact-worker
          command: deploy --config wrangler.toml
          postCommands: |
            printf '%s' "$CONTACT_RECIPIENT" | npx wrangler secret put CONTACT_RECIPIENT --name matveyshemyakin-contact --config wrangler.toml
      - name: Verify Worker route
        run: |
          code="$(curl --silent --show-error --output /tmp/contact-worker-response --write-out '%{http_code}' --request OPTIONS https://matveyshemyakin.ru/api/contact)"
          cat /tmp/contact-worker-response || true
          test "$code" = "204"
      - name: Verify email sending
        run: |
          started_at="$(( $(date +%s%3N) - 5000 ))"
          payload="$(printf '{\"name\":\"Deployment test\",\"organization\":\"matveyshemyakin.ru\",\"reply_email\":\"test@example.com\",\"topic\":\"other\",\"message\":\"Automated Cloudflare Worker deployment verification message.\",\"honeypot\":\"\",\"consent\":true,\"started_at\":%s}' "$started_at")"
          code="$(curl --silent --show-error --output /tmp/contact-send-response --write-out '%{http_code}' --request POST https://matveyshemyakin.ru/api/contact --header 'Origin: https://matveyshemyakin.ru' --header 'Content-Type: application/json' --data "$payload")"
          cat /tmp/contact-send-response || true
          test "$code" = "200"
          grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true' /tmp/contact-send-response
