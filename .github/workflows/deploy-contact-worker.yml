name: Deploy contact Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/contact-worker/**'
      - '.github/workflows/deploy-contact-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTACT_RECIPIENT: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CONTACT_RECIPIENT"
      - name: Deploy contact Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/contact-worker
          secrets: |
            CONTACT_RECIPIENT
      - name: Verify Worker route
        run: |
          code="$(curl --silent --show-error --output /tmp/contact-worker-response --write-out '%{http_code}' --request OPTIONS https://matveyshemyakin.ru/api/contact)"
          cat /tmp/contact-worker-response || true
          test "$code" = "204"
      - name: Record successful deployment
        run: |
          mkdir -p .deployment
          printf '{\n  "service": "contact-worker",\n  "status": "deployed",\n  "route_check": 204,\n  "source_sha": "%s",\n  "deployed_at_utc": "%s"\n}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deployment/contact-worker.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/contact-worker.json
          git diff --cached --quiet && exit 0
          git commit -m "Record contact Worker deployment"
          git pull --rebase origin main
          git push origin HEAD:main
