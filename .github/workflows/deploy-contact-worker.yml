name: Deploy contact Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/contact-worker/**'
      - '.github/workflows/deploy-contact-worker.yml'

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CONTACT_RECIPIENT_EMAIL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy contact Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/contact-worker
          secrets: |
            CONTACT_RECIPIENT
        env:
          CONTACT_RECIPIENT: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
      - name: Verify Worker route
        run: |
          code="$(curl --silent --show-error --output /tmp/contact-worker-response --write-out '%{http_code}' --request OPTIONS https://matveyshemyakin.ru/api/contact)"
          cat /tmp/contact-worker-response || true
          test "$code" = "204"
