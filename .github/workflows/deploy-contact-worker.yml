name: Deploy contact Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/contact-worker/**'
      - '.github/workflows/deploy-contact-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTACT_RECIPIENT: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CONTACT_RECIPIENT"
      - name: Deploy contact Worker
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/contact-worker
          secrets: |
            CONTACT_RECIPIENT
      - name: Verify Worker route
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          code="$(curl --silent --show-error --output /tmp/contact-worker-response --write-out '%{http_code}' --request OPTIONS https://matveyshemyakin.ru/api/contact)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/contact-worker-response || true
          test "$code" = "204"
      - name: Record deployment status
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_STDERR: ${{ steps.deploy.outputs.command-stderr }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ROUTE_CODE: ${{ steps.verify.outputs.code }}
        run: |
          status="failed"
          reason="cloudflare_deploy"
          route_code="${ROUTE_CODE:-0}"
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ] && [ "$route_code" = "204" ]; then
            status="deployed"
            reason="ok"
          elif [ "$DEPLOY_OUTCOME" = "success" ]; then
            reason="route_verification"
          else
            err="$(printf '%s' "$DEPLOY_STDERR" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$err" | grep -qE 'email|send_email'; then
              reason="email_service_or_binding"
            elif printf '%s' "$err" | grep -qE 'unauthor|authenticat|permission|10000|10001'; then
              reason="cloudflare_auth_or_permissions"
            elif printf '%s' "$err" | grep -qE 'route|zone'; then
              reason="route_or_zone"
            fi
          fi
          mkdir -p .deployment
          printf '{\n  "service": "contact-worker",\n  "status": "%s",\n  "reason": "%s",\n  "route_check": %s,\n  "source_sha": "%s",\n  "checked_at_utc": "%s"\n}\n' "$status" "$reason" "$route_code" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deployment/contact-worker.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/contact-worker.json
          if ! git diff --cached --quiet; then
            git commit -m "Record contact Worker deployment status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require successful deployment
        if: always()
        run: grep -q '"status": "deployed"' .deployment/contact-worker.json
